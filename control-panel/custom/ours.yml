      VLLM_W4A8_MOE_G2FUSE_BYLANE: ""
      WOFF_CHUNK_MIB: "640"
      WOFF_DEVICE_GB: ""
      WOFF_HOST_GB: ""
    group_add:
      - video
    image: minisgl-rdna4:lean
    ipc: host
    networks:
      default: null
    ports:
      - mode: ingress
        target: 1919
        published: "1919"
        protocol: tcp
    restart: 'no'
    security_opt:
      - seccomp=unconfined
      - label=disable
    shm_size: "17179869184"
    ulimits:
      memlock: -1
    volumes:
      - type: bind
        source: /home/pat/code/minisgl-rdna4-regress
        target: /engine
        bind: {}
      - type: bind
        source: /home/pat/ai/hf
        target: /root/.cache/huggingface
        bind: {}
      - type: bind
        source: /home/pat/models
        target: /models
        bind: {}
      - type: bind
        source: /home/pat/code/_models
        target: /drafts
        read_only: true
        bind: {}
      - type: bind
        source: /home/pat/fixtures/minisgl-ghost-oracle
        target: /ghost
        bind: {}
      - type: bind
        source: /home/pat/ai/hf/q4e-mxfp4
        target: /model
        read_only: true
        bind: {}
      # PLE MUST COME FROM A recordsize=4K DATASET, NOT THE CHECKPOINT DIRECTORY.
      # A PLE row is 120 B and decode reads 16 rows/token. The checkpoint lives on
      # zpcachyoshome/models/hf at recordsize=1M, so every row read pulled a whole record:
      # MEASURED 418-444 KiB of device traffic per row vs 17-24 KiB on 4K (18-24x). That was
      # ~240 MiB/s of random reads on the SAME POOL as /home -- it froze the desktop for seconds
      # at a time (PSI io some=8.36) and the user stopped the test. The NVFP4 arm never showed
      # this because it mounts /home/pat/ai/ple, which IS 4K.
      # zpcachyoshome/models/ple-mxfp4 holds a rewritten copy of the 9 PLE-bearing shards.
      # REWRITTEN, not cp'd: zfs_bclone_enabled=1, so a plain `cp` BLOCK-CLONES and silently
      # inherits the source's 1M geometry -- 47 GB "copied" in 30 s, pool avail unchanged, and
      # `zdb -ddddd` still showing dblk=1M. Use `cp --reflink=never` and verify with zdb.
      # The isolated NVFP4 set is NOT reusable here: its rows are fp8-LUT, MXFP4's are int6 g32.
      - type: bind
        source: /home/pat/ai/ple-mxfp4
        target: /ple
        read_only: true
        bind: {}
    working_dir: /engine
