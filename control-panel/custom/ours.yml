name: minisgl-rdna4-regress
services:
  serve:
    profiles:
      - serve
    build:
      context: /home/pat/code/minisgl-rdna4-regress
      dockerfile: Dockerfile
      additional_contexts:
        kernels: /home/pat/code/rdna4-hip-kernels
        uprof: /home/pat/pkgs
    cap_add:
      - SYS_PTRACE
    command:
      - exec /engine/tools/serve.sh
    container_name: minisgl-lean-serve
    devices:
      - source: /dev/kfd
        target: /dev/kfd
        permissions: rwm
      - source: /dev/dri
        target: /dev/dri
        permissions: rwm
    entrypoint:
      - bash
      - -lc
    environment:
      AMD_SERIALIZE_KERNEL: ""
      ATTN: ""
      CACHE_TYPE: ""
