# Prometheus scrape config for local vLLM metrics capture.
#
# vLLM exposes Prometheus metrics at /metrics on its serve port. Our compose serve
# profiles publish that port on the HOST as ${VLLM_HOST_PORT:-8000}:8000, i.e. 8000 for a
# default serve; a SECOND concurrent serve has to take a different host port or the bind
# collides, and 8001 is the convention (set VLLM_HOST_PORT to move it). So we scrape both
# host ports; whichever serve is up is captured, the other is simply marked down.
# host.docker.internal resolves to the docker host (extra_hosts: host-gateway in
# docker-compose.yml).
#
# 1s scrape for near-real-time dashboards (matches the minisgl scheduler's 0.5s metrics
# emit, so the gauges are at most ~1s stale, and discrete signals like the GPU mem clock
# render as clean steps rather than downsample-averaged ramps). This is ~5x the TSDB write
# rate of the old 5s — fine for interactive sessions; bump back toward 5s for multi-day
# unattended runs if the volume grows. Retention is set on the prometheus command line
# (--storage.tsdb.retention.time), data persists in the named volume vllm-prom-data — so a
# serve run's behavior is analyzable AFTER the container is gone.
global:
  scrape_interval: 1s
  evaluation_interval: 30s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      # port 8000 = the default single-card / TP=2 serve; 8001 = a second concurrent serve
      # (e.g. the zaya profile, or another instance started with VLLM_HOST_PORT=8001).
      - targets: ['host.docker.internal:8000', 'host.docker.internal:8001']
    # Tag each series with the host port it came from, so two concurrent serves are
    # distinguishable beyond the model_name label vLLM already emits.
    relabel_configs:
      - source_labels: [__address__]
        regex: 'host.docker.internal:(\d+)'
        target_label: serve_port
        replacement: '${1}'

  # minisgl inference server (separate engine, NOT vLLM). Its serve container
  # (${LEASE_NAME}-serve, per docker-compose.yml) publishes /metrics on host port 1919
  # (this repo's EXPOSE port; a hand-rolled serve maps it with -p 1919:1919). Metrics are
  # minisgl_* (see the minisgl-serving Grafana dashboard). DOWN until the serve exposes
  # /metrics — that's expected; the target config is what matters. host.docker.internal → docker host.
  - job_name: minisgl
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:1919']
    relabel_configs:
      - source_labels: [__address__]
        regex: 'host.docker.internal:(\d+)'
        target_label: serve_port
        replacement: '${1}'

  # amdgpu hardware telemetry (per-card load/power/temp/vram/clocks). The gpu-exporter service
  # runs in the vllm-gfx1201 compose project, so Prometheus reaches it by service name on the
  # shared default network — no host.docker.internal / published-port dependency. Metrics are
  # amdgpu_* (host-wide, labelled by physical `gpu` id, NOT per-serve). Feeds the GPU row on the
  # minisgl-serving Grafana dashboard (power/clocks/temp/vram/bandwidth).
  - job_name: gpu
    metrics_path: /metrics
    static_configs:
      - targets: ['gpu-exporter:9400']
