# Build the prebuilt minisglang-rdna4 serving image and push it to GHCR.
#
# Manual-trigger only (workflow_dispatch) — it does NOT run on push, so it never fails CI on a fork
# that lacks the secrets below. The custom HIP kernels live in a SEPARATE (private) repo, so this
# job checks that repo out into the `kernels` build context. It requires one repo secret:
#
#   KERNELS_PAT  — a PAT (or fine-grained token) with `contents: read` on the kernels repo.
#
# The image is pushed with GITHUB_TOKEN (packages: write), so no extra registry secret is needed.

name: publish-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (in addition to :latest and :<sha>)"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/minisglang-rdna4
  KERNELS_REPO: patcarter883/rdna4-hip-kernels

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout engine repo
        uses: actions/checkout@v4

      - name: Checkout canonical HIP kernels (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNELS_REPO }}
          token: ${{ secrets.KERNELS_PAT }}
          path: _kernels

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          sha="$(git rev-parse --short HEAD)"
          tags="${IMAGE}:latest,${IMAGE}:${sha}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tags="${tags},${IMAGE}:${{ github.event.inputs.tag }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            kernels=_kernels
          push: true
          tags: ${{ steps.tags.outputs.tags }}
