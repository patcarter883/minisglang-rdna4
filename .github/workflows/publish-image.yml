# Build the prebuilt minisglang-rdna4 serving image and push it to GHCR.
#
# Manual-trigger only (workflow_dispatch) — it does NOT run on push, so it never fails CI on a fork.
# The custom HIP kernels live in a SEPARATE repo, checked out here into the `kernels` build context.
# That repo is public, so actions/checkout needs no token; the image is pushed with GITHUB_TOKEN
# (packages: write), so this job needs no secrets at all.
#
# HEADS UP — the finished image is ~33 GB and the kernel compile is long. A GitHub-hosted
# `ubuntu-latest` runner has ~14 GB of free disk, so this job will fail on space there unless you
# free it first (or point `runs-on` at a self-hosted runner). Until that is settled, the reliable
# path is a local build and push — see docs/IMAGE.md.

name: publish-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (in addition to :latest and :<sha>)"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/minisglang-rdna4
  KERNELS_REPO: patcarter883/rdna4-hip-kernels

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout engine repo
        uses: actions/checkout@v4

      - name: Checkout canonical HIP kernels
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNELS_REPO }}
          path: _kernels

      # The Dockerfile's profiling stage does `COPY --from=uprof .` unconditionally, because AMD
      # serves the uProf .deb only behind a EULA click-through and it cannot be fetched at build
      # time. With no `uprof` context BuildKit tries to resolve the name as a REGISTRY image and
      # dies with "pull access denied ... insufficient_scope", which reads like an auth failure
      # rather than a missing context. An EMPTY directory is all CI needs -- the stage self-skips
      # when it finds no .deb. Omitting this is why :latest sat frozen from 2026-07-14.
      - name: Create empty uProf build context
        run: mkdir -p _uprof

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          sha="$(git rev-parse --short HEAD)"
          tags="${IMAGE}:latest,${IMAGE}:${sha}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tags="${tags},${IMAGE}:${{ github.event.inputs.tag }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            kernels=_kernels
            uprof=_uprof
          push: true
          tags: ${{ steps.tags.outputs.tags }}
