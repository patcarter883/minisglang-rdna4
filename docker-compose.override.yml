# Dev override: hot-mounted engine source + shadow-mounted kernel packages, and the perf knobs the
# base compose does not forward.
#
# The env block lives HERE rather than in docker-compose.yml on purpose. These are pass-throughs
# with defaults that match the code / image defaults, so they change nothing unless an A/B script
# sets them — but without them an `A=1 docker compose up` silently does NOTHING, because compose
# only forwards variables it names. That failure is invisible: the serve comes up healthy and just
# measures the default config, which is how a MAXM A/B ended up comparing a config against itself.
services:
  serve:
    environment:
      # decode-GEMV routing (code defaults: on / MAXM 16 — see layers/minv.py and gdn/layer.py)
      MINISGL_GDN_PROJ_GEMV: "${MINISGL_GDN_PROJ_GEMV:-1}"
      MINISGL_GDN_PROJ_GEMV_MAXM: "${MINISGL_GDN_PROJ_GEMV_MAXM:-16}"
      MINISGL_MINV_DECODE_GEMV: "${MINISGL_MINV_DECODE_GEMV:-1}"
      MINISGL_MINV_DECODE_GEMV_MAXM: "${MINISGL_MINV_DECODE_GEMV_MAXM:-16}"
      MINISGL_MINV_GEMM: "${MINISGL_MINV_GEMM:-1}"
      MINISGL_ROUTER_FUSED: "${MINISGL_ROUTER_FUSED:-1}"
      # kernel-side, no Python default possible (getenv inside the kernel); baked in the Dockerfile
      VLLM_W4A8_MOE_G2FUSE_BYLANE: "${VLLM_W4A8_MOE_G2FUSE_BYLANE:-1}"
      MINISGL_HOSTPROF: "${MINISGL_HOSTPROF:-0}"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      - ${FP8_WMMA_PKG:-/home/pat/code/rdna4-hip-kernels-mmax/fp8_wmma/torch-ext/fp8_wmma}:/opt/kernels/fp8_wmma:ro
      - ${MOE_HIP_PKG:-/home/pat/code/rdna4-hip-kernels-build/moe/torch-ext/moe_hip}:/opt/kernels/moe_hip:ro
