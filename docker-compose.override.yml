# Dev override: hot-mounted engine source + shadow-mounted kernel packages.
#
# There is deliberately NO environment block here. The decode-GEMV routing, the fused MoE
# router and the fused-gemm2 BYLANE tiling are all UNCONDITIONAL in code/kernel now — they
# used to need env knobs, and compose only forwards variables it names, so a knob that the
# base compose did not list silently did nothing (an A/B once compared a config to itself
# with no symptom). Nothing to forward means nothing to get wrong.
services:
  serve:
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      # Kernel shadow-mounts for A/B-ing an unbuilt kernel change against the baked image. These
      # default to the CANONICAL repo, not a task worktree: the old defaults pointed at
      # rdna4-hip-kernels-mmax, which predates the bylane/tiling-table work, so a plain
      # `docker compose up` silently DOWNGRADED the image's kernels with no symptom.
      # The mounted package must be BUILT, and built INSIDE this serve image (a .so from another
      # image fails with "libc10.so: cannot open shared object file", which presents as a serve
      # that never reaches the GPU). tools/_maxm_ab.sh has the preflight that catches both.
      - ${FP8_WMMA_PKG:-/home/pat/code/rdna4-hip-kernels/fp8_wmma/torch-ext/fp8_wmma}:/opt/kernels/fp8_wmma:ro
      - ${MOE_HIP_PKG:-/home/pat/code/rdna4-hip-kernels/moe/torch-ext/moe_hip}:/opt/kernels/moe_hip:ro
