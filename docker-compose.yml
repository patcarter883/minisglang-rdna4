# minisgl-rdna4 serving stack — a from-scratch, purpose-built image (Dockerfile), NOT the vllm image.
#
# The image is built for minisglang: ROCm 7.2.1 + torch(gfx1201) + the engine's python deps + the
# custom HIP kernels built from the CANONICAL `rdna4-hip-kernels` repo. No vllm, sglang, flashinfer,
# triton, or sgl_kernel.
#
# The engine SOURCE is hot-mounted at /engine (edit-and-restart), but the kernels come from the image
# (/opt/kernels, canonical) — the repo no longer vendors them.
#
# Usage (GPU work leased through the shared arbiter; --detach binds the lease to the container):
#   # build (CPU only — kernel compiles need no GPU/lease):
#   docker compose build
#   # serve (single card):
#   gpu-lease -n 1 --detach -- docker compose --profile serve up -d
#   docker compose --profile serve logs -f
#   gpu-lease -n 1 --detach -- docker compose --profile serve down

x-lean-common: &lean-common
  image: ${MINISGL_IMAGE:-minisgl-rdna4:lean}
  build:
    context: .
    dockerfile: Dockerfile
    additional_contexts:
      # The canonical kernels live outside this repo's build context — inject them by name.
      kernels: ${RDNA4_HIP_KERNELS:-/home/pat/code/rdna4-hip-kernels}
      # AMD uProf .deb, likewise outside the context (AMD serves it only behind a EULA click-through,
      # so it cannot be fetched at build time). WITHOUT this entry `docker compose build` FAILS:
      # the Dockerfile's `COPY --from=uprof .` makes docker try to resolve `uprof` as a REGISTRY
      # image and it dies with "pull access denied ... insufficient_scope", which reads like an auth
      # problem rather than a missing context. The stage skips cleanly when the dir holds no .deb.
      uprof: ${UPROF_PKG_DIR:-/home/pat/pkgs}
  restart: "no"
  working_dir: /engine
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add: [video]
  security_opt: [seccomp=unconfined, label=disable]
  cap_add: [SYS_PTRACE]
  ipc: host
  shm_size: "16gb"
  volumes:
    # Engine source (kernels are NOT here anymore — they come from /opt/kernels in the image).
    - .:/engine
    - ${HF_HOME:-/home/pat/ai/hf}:/root/.cache/huggingface
    # Ghost-oracle state. A DURABLE host path on purpose: it accumulates over days and must outlive
    # both the container and this worktree (which goes away when the branch merges), so it does not
    # belong in a container layer or under /engine.
    - ${GHOST_ORACLE_DIR:-/home/pat/fixtures/minisgl-ghost-oracle}:/ghost
  environment: &lean-env
    # /opt/kernels (canonical HIP kernels, baked into the image) FIRST so nothing under /engine can
    # shadow them; /engine/python = engine; /engine = the 3 not-yet-canonical kernels (w8a8 /
    # moe_bf16 / rxf, still vendored here until ported upstream).
    # PARAMETERIZED so an A/B can put a freshly-built kernel package AHEAD of the baked
    # /opt/kernels without rebuilding the image. Default is byte-identical to the old value.
    PYTHONPATH: "${MINISGL_PYTHONPATH:-/opt/kernels:/engine/python:/engine}"
    # The container runs as root over a bind-mounted source tree, so any .pyc it writes is
    # root-owned and a later non-root `rm -rf` of that directory silently FAILS. Off by default is
    # wrong for the serve (import cost), so this stays opt-in for harnesses that swap packages in
    # and out of the mount.
    PYTHONDONTWRITEBYTECODE: "${PYTHONDONTWRITEBYTECODE:-}"
    HF_HUB_OFFLINE: "0"
    TORCH_BLAS_PREFER_HIPBLASLT: "0"
    # Fragmentation guard: on the 16 GB cards a full-model + graph-capture footprint (e.g. the 35B
    # MXFP4 GDN-hybrid) can leave enough free memory but too little CONTIGUOUS free after capture —
    # a tiny post-capture alloc then OOMs on fragmentation. expandable_segments lets the allocator
    # grow segments instead. Overridable/empty-safe.
    PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
    # The lease injects the leased card set; these MUST stay distinct (physical id vs 0-based
    # re-index) — see CLAUDE.md visible-devices recipe.
    ROCR_VISIBLE_DEVICES: "${LEASE_ROCR_DEVICES:-0}"
    HIP_VISIBLE_DEVICES: "${LEASE_HIP_DEVICES:-0}"
    # Fused MoE decode gemm2 top_k split (grid.z). The split itself is DERIVED from occupancy in
    # the kernel launcher and is NOT gated — these two are sweep/A-B handles, exactly like
    # VLLM_W4A8_MOE_BN: _K forces a slice count so a control leg can run the unsplit grid from the
    # SAME binary, _DEBUG makes the launcher print the count it chose (the A/B's provenance).
    MINISGL_MOE_G2_SPLIT_K: "${MINISGL_MOE_G2_SPLIT_K:-}"
    MINISGL_MOE_G2_SPLIT_DEBUG: "${MINISGL_MOE_G2_SPLIT_DEBUG:-}"
    # Tool-call runaway defenses (api_server; empty-safe via env_int, defaults live in code):
    # _CONT_LIMIT rejects a continuation replaying an unclosed block past N chars (default 49152);
    # _RUNAWAY_LIMIT force-finishes an in-flight generation once a single unclosed block passes N
    # chars (default 65536). 0 disables either.
    MINISGL_TOOLCALL_CONT_LIMIT: "${MINISGL_TOOLCALL_CONT_LIMIT:-}"
    MINISGL_TOOLCALL_RUNAWAY_LIMIT: "${MINISGL_TOOLCALL_RUNAWAY_LIMIT:-}"
    # Twin handle for the SCATTER arm's K carve (M<=2). "legacy" reproduces the retired
    # `4 if M == 1 else 1` so a control leg can measure what that constant cost e2e.
    MINISGL_MOE_SPLITK_SCATTER: "${MINISGL_MOE_SPLITK_SCATTER:-}"
    # ---- host-RAM tier for the recurrent-radix snapshot store ----------------------------------
    # The store used to be a VRAM reservation subtracted from the KV pool (20 snapshots x 16.4 MiB
    # = 0.32 GiB = 67,200 KV tokens on the 35B at TP=2/CONC=4). Holding it in PINNED HOST RAM hands
    # those tokens back — and since the ceiling is min(max_position_embeddings, pool), i.e.
    # pool-bound, they are also context. A snapshot is a fixed size regardless of how much context
    # it represents and is touched once at a prefix hit, never on the decode path, so the trade is
    # PCIe-vs-recompute (~0.33 ms) not PCIe-vs-VRAM. Default ON; =0 restores device clones.
    MINISGL_REC_SNAP_HOST: "${MINISGL_REC_SNAP_HOST:-1}"
    # Device staging frames. 1 = one contiguous 16.4 MiB DMA each way, and the next forward waits
    # only on the ~30 us gather instead of the whole PCIe leg. 0 wins the last 2.4% of the pool but
    # turns the copy into 60 per-layer calls ON the critical path. Empty = 1.
    MINISGL_REC_SNAP_STAGE_RING: "${MINISGL_REC_SNAP_STAGE_RING:-}"
    # Pinned arena size. Empty = derived from the live working set + the in-flight ladder.
    MINISGL_REC_SNAP_HOST_GIB: "${MINISGL_REC_SNAP_HOST_GIB:-}"
    # ---- ghost oracle (MEASURE-ONLY; decides whether a host KV tier is worth building) ----------
    # Reports how much cross-request prefix reuse the cache throws away, SPLIT into "KV was resident
    # but the snapshot had been dropped" (-> raise the snapshot cap) vs "neither was resident"
    # (-> needs a host KV tier). Costs a .tolist() + O(pages) hashing per admitted request, so it is
    # OFF unless asked for. Harvest with `grep ghost-oracle` on the serve log.
    MINISGL_GHOST_ORACLE: "${MINISGL_GHOST_ORACLE:-0}"
    MINISGL_GHOST_ORACLE_EVERY: "${MINISGL_GHOST_ORACLE_EVERY:-}"
    # Persist counters AND the seen-prefix LRU across restarts. The LRU is the part that must
    # survive: `potential` is defined against prompts seen EARLIER, so a cold start makes every
    # prompt look novel and systematically UNDER-reports reuse — biasing the answer toward "don't
    # build it". Keyed by model inside the dir, so changing model parks a file rather than mixing
    # two tokenizers' hashes into one number. Empty = in-memory only.
    MINISGL_GHOST_ORACLE_DIR: "${MINISGL_GHOST_ORACLE_DIR:-/ghost}"
    MINISGL_KV_FP8: "${MINISGL_KV_FP8:-1}"
    # Fused HIP top-k/top-p sampler (engine/_sampler_hip.py). Default ON; 0 forces the pure-torch
    # reference sampler — the sampler-correctness A/B arm. Was NOT forwarded here, so setting it at
    # launch silently did nothing (the five-hops trap): the A/B would have run the kernel on both
    # arms and reported the kernel clean. Empty forward is safe for this parse ("" != "0" -> ON).
    MINISGL_FUSED_SAMPLER: "${MINISGL_FUSED_SAMPLER:-}"
    # Native HIP attention within the rdna4 backend (attention/rdna4.py). Default ON; 0 falls back
    # to the pure-Triton unified_attention — the attention-numerics A/B arm (only read when
    # ATTN=rdna4). Same five-hops trap as above: read by the engine, previously never forwarded.
    MINISGL_ATTN_HIP: "${MINISGL_ATTN_HIP:-}"
    # Server default think budget (scheduler β backstop; scheduler.py reads it, default 1024).
    # Needed at launch for models whose template has NO reasoning level (e.g. Qwen3.6): there the
    # 1024 cap still applies to every thinking request, so a long-thinking comparison against a
    # level-capable model (Qwen3.8, uncapped) is unfair unless this is raised. Third instance of
    # the five-hops trap: read by the engine, was never forwarded.
    MINISGL_THINK_BUDGET: "${MINISGL_THINK_BUDGET:-}"
    # fp8-KV scale SIDECAR (tools/kv_fp8_calibrate.py output) — a path, not a feature gate. Unset =
    # resolve from the checkpoint's quantization_config.kv_cache_scheme, or warn + identity scale.
    MINISGL_KV_FP8_SCALES: "${MINISGL_KV_FP8_SCALES:-}"
    # PROTOTYPE (perf/custom-ar-ep): route the in-graph EP MoE all_reduce through the custom_ar one-shot
    # P2P all-reduce instead of RCCL (dp_size==2 + P2P only). Default 0 (RCCL) so this is an opt-in A/B.
    MINISGL_CUSTOM_AR_EP: "${MINISGL_CUSTOM_AR_EP:-0}"
    # custom_ar peer-wait BOUND, in seconds. The cross-GPU handshake used to spin forever on a peer
    # that never arrived, pinning a card at 100% gfx / 0% memory; it is now bounded in-kernel with a
    # 30 s default. This forwards the override — and it is here because the knob was added WITHOUT
    # it and was therefore inert: compose only forwards variables it NAMES, so three A/B boots ran
    # at the 30 s default while reporting 20 s. Same trap the header of docker-compose.override.yml
    # describes. 0 restores the old unbounded spin (only to prove a hang is real).
    MINISGL_CUSTOM_AR_TIMEOUT_S: "${MINISGL_CUSTOM_AR_TIMEOUT_S:-}"
    # Custom one-shot P2P EP all_GATHER (all_gather_p2p, baked into the lean custom_ar). DEFAULT ON —
    # moves the fused EP dispatch gather off RCCL; decoupled from AR, no-ops on non-EP serves, and falls
    # back to RCCL if the baked custom_ar lacks the kernel or P2P is unavailable. Set 0 to force RCCL.
    MINISGL_CUSTOM_AG_EP: "${MINISGL_CUSTOM_AG_EP:-1}"
    # Reasoning + structured output: gate the JSON grammar until </think> (default on). Set 0 to
    # apply the schema from token 0 even with thinking on (the pre-fix behavior / A-B toggle).
    MINISGL_GRAMMAR_THINK_GATE: "${MINISGL_GRAMMAR_THINK_GATE:-1}"
    # DFlash drafter weight-only quant (fp8|int8|nvfp4) — shrinks the replicated drafter to fit big
    # pairs. nvfp4 is 4-bit weights riding the shared W4A8 core; fp8/int8 are 1 byte/param.
    MINISGL_DFLASH_QUANT: "${MINISGL_DFLASH_QUANT:-}"
    # DSpark diagnostic: 0 loads the checkpoint but skips its Markov head, so the SAME drafter runs
    # as plain DFlash. Separates "the Markov application is wrong" from "the backbone is mismatched".
    MINISGL_DSPARK_MARKOV: "${MINISGL_DSPARK_MARKOV:-}"
    # DSpark confidence head: 0 skips loading it (no adaptive draft length). TAU is the cumulative
    # survival threshold the drafted block is truncated at (engine default 0.5; 0 = never truncate).
    # Forwarded because the engine reads them INSIDE the container — no entry means silently unset.
    MINISGL_DSPARK_CONF: "${MINISGL_DSPARK_CONF:-}"
    MINISGL_DSPARK_CONF_TAU: "${MINISGL_DSPARK_CONF_TAU:-}"
    # Diagnostic: bring the DSpark confidence head's per-position prediction host-side even at
    # tau=0 (where it is computed and discarded) and log it against what verify actually accepted.
    # Answers "does the drafter know it is guessing", which accept-rate alone cannot.
    MINISGL_DSPARK_CONF_CAL: "${MINISGL_DSPARK_CONF_CAL:-}"
    # Draft-model VRAM RESERVE overrides. Forwarded because the engine reads them from os.environ
    # INSIDE the container: with no passthrough entry they are silently unset there, so the only
    # documented lever for a mis-estimated drafter reserve could not be pulled through the normal
    # launch path at all — setting it on the host looked like it worked and did nothing.
    # _GB replaces the whole reserve; _MARGIN_GB tunes only the eager working-set headroom (0.7 GB
    # default), which is the generous part once the drafter is small and quantized.
    MINISGL_DRAFT_RESERVE_GB: "${MINISGL_DRAFT_RESERVE_GB:-}"
    MINISGL_DRAFT_RESERVE_MARGIN_GB: "${MINISGL_DRAFT_RESERVE_MARGIN_GB:-}"
    # Override the target layers whose hidden states feed the drafter's `fc`. Forwarded so the
    # indexing convention can be A/B'd: a drafter records these in its own config, but conventions
    # differ between builds of the SAME drafter (Muse-Glimmer's safetensors config says
    # [1,13,25,37,49] while its GGUF says [2,14,26,38,50]) — and capturing the wrong set does not
    # error, it just quietly halves acceptance, which is indistinguishable from a bad drafter.
    MINISGL_DFLASH_CAPTURE_LAYERS: "${MINISGL_DFLASH_CAPTURE_LAYERS:-}"
    # Cap the drafter's block size below the checkpoint's (block = min(ckpt, this); drafts = block-1).
    # The propose cost lever for a drafter whose late positions never accept: head rows, markov walk
    # length and the block forward all shrink with it. Forwarded for the same reason as every other
    # MINISGL_* knob here — the engine reads it INSIDE the container.
    MINISGL_DFLASH_BLOCK: "${MINISGL_DFLASH_BLOCK:-}"
    # DDTree: route DFlash through the drafter-agnostic draft-TREE step (per-position top-K marginals
    # -> best-first tree -> ancestor-mask verify) for a higher accept-len than the linear K chain.
    # Forwarded so the scheduler's os.environ read sees it inside the container; topk/budget default
    # in the scheduler when unset.
    MINISGL_DFLASH_DDTREE: "${MINISGL_DFLASH_DDTREE:-}"
    MINISGL_DDTREE_TOPK: "${MINISGL_DDTREE_TOPK:-}"
    MINISGL_DDTREE_BUDGET: "${MINISGL_DDTREE_BUDGET:-}"
    # MTP-head layer count override (config.py knob): forces the Qwen3.5 MTP head on/off through
    # compose. Empty -> trust the checkpoint (default). 0 -> no MTP head (serve the base decoder only).
    MINISGL_MTP_LAYERS: "${MINISGL_MTP_LAYERS:-}"
    # Spec-decode on-device accept+EOS chain (spec/accept_gpu.py): 1 = replace the per-position
    # argmax .cpu() + per-req Python verify/keep loop with the vectorized GPU chain (one batched
    # sync). Byte-lossless; falls back to the host path for constrained/ddtree batches. Default 0.
    MINISGL_SPEC_ONDEVICE: "${MINISGL_SPEC_ONDEVICE:-0}"
    # Spec diagnostic: 1 = stage+verify drafts normally but ACCEPT NONE (emit only the bonus token).
    # Isolates verify-forward cost from accept/commit cost — a step still pays the full propose +
    # qlen=K+1 verify, so 1/tok_s is the propose+verify time with the accept path removed.
    MINISGL_SPEC_FORCE_N0: "${MINISGL_SPEC_FORCE_N0:-}"
    # Sampled (rejection-sampling) verify. Was forwarded ONLY by the `cam` service, so on the serve
    # profile — the path everything actually runs on — it was unreachable: tools/serve.sh defaults it
    # to 1 inside the container and nothing outside could say otherwise. That matters because sampled
    # verify is DISTRIBUTIONALLY lossless, not TOKEN lossless, so it is exactly the knob you must be
    # able to turn off to test the greedy invariant (greedy+spec == greedy plain). Forwarded here, in
    # the shared anchor, so every service inherits it.
    MINISGL_SPEC_SAMPLED: "${MINISGL_SPEC_SAMPLED:-}"
    # Base seed for the sampled-verify RNG (scheduler.py). The reader is int() over the RAW value,
    # so the code default is repeated here rather than forwarded empty — int("") raises at boot.
    MINISGL_SPEC_SAMPLED_SEED: "${MINISGL_SPEC_SAMPLED_SEED:-42}"
    # Expert-divergence probe (quant/kernels.py:_route_stats): set to a path under /engine and every
    # small-M MoE call records its routing shape (distinct experts, moe_align block count, union
    # curve) to JSON. Diagnostic only — it syncs per call, so never set it on a timed run.
    MINISGL_MOE_ROUTE_STATS: "${MINISGL_MOE_ROUTE_STATS:-}"
    MINISGL_MOE_ROUTE_STATS_N: "${MINISGL_MOE_ROUTE_STATS_N:-}"
    # Prefill working-set probe (engine.py forward_batch): =1 logs, per PREFILL step, the peak
    # allocation delta plus the ABSOLUTE alloc/reserved/device-free levels. The absolute levels are
    # the point — a previous investigation found the per-step delta FLAT (~465 MiB at 8192 tokens,
    # independent of ctx and bs) while the card still filled up, so the OOM lives in the baseline
    # climbing between steps, not in one step's spike. It synchronizes per prefill: diagnostic only,
    # never set it on a timed run. Was engine-side only and unreachable from compose until now.
    # Per-stage HOST-overhead profiler: =N logs the decode loop's wall-time breakdown (recv,
    # sched, gpu_wait, ...) every N steps on rank 0. Zero cost unset. It existed in the scheduler
    # but was unreachable from a compose serve, so the one instrument that attributes serving
    # overhead could only be used from the in-process harness — which is the path that does NOT
    # have the overhead. Plumbed 2026-09-07 while chasing 131 ms/token vs the harness's 60.5.
    MINISGL_HOSTPROF: "${MINISGL_HOSTPROF:-}"
    MINISGL_PREFILL_MEM_PROBE: "${MINISGL_PREFILL_MEM_PROBE:-}"
    # Prefill activation guard (scheduler.py): affordable = (devfree - SAFETY) / KIB_PER_TOKEN.
    # The default 64 KiB/token was MEASURED ON Qwen3.6-35B (58-65 KiB/token) and is MODEL-SPECIFIC —
    # it is not a universal constant. Measured on gemma-4-26B-A4B (2026-08-07, pf-probe, TP=2):
    #     1696 tok -> 142.8 MiB   2912 tok -> 245.4 MiB   4192 tok -> 386.7 MiB
    # i.e. a MARGINAL ~100 KiB/token, ~1.6x the Qwen figure, because gemma4's MoE prefill buffers are
    # wider per token (hidden 2816 vs 2048, 2*inter 1408 vs 1024, same top_k=8). With the Qwen value
    # the guard admits a chunk that cannot fit and the worker dies mid-forward. Set it per model.
    MINISGL_PREFILL_ACT_KIB_PER_TOKEN: "${MINISGL_PREFILL_ACT_KIB_PER_TOKEN:-}"
    MINISGL_PREFILL_ACT_SAFETY_MIB: "${MINISGL_PREFILL_ACT_SAFETY_MIB:-}"
    # Decode-GEMV tiling override for the fused MoE gemm2 (gemv_decode.h select_gemv_tiling).
    # 0 forces the K-on-lanes sweep, which is what every group-16 (NVFP4) shape got before
    # Int4Fp8GemvLoader declared bylane_min_group_v=16 — i.e. the matched A/B baseline, same binary.
    VLLM_W4A8_MOE_G2FUSE_BYLANE: "${VLLM_W4A8_MOE_G2FUSE_BYLANE:-}"
    # MoE quant mode: 0 = W4A8 (int4 wt + int8/fp8 act via FP8-WMMA); 1 = W4A16 (weight-only, fp16 act).
    MINISGL_MOE_W4A16: "${MINISGL_MOE_W4A16:-0}"
    # SSM recurrent-state STORAGE dtype: 1 (default) = bf16, 0 = fp32. Passed through for the
    # Qwen3.8 corruption bisection — the bf16 bounded-rounding claim is horizon/model-dependent.
    MINISGL_SSM_BF16: "${MINISGL_SSM_BF16:-1}"
    # ReplaySSM ring: 1 (default) = deferred-fold decode, 0 = bit-exact per-step path (bisection).
    MINISGL_GDN_REPLAY: "${MINISGL_GDN_REPLAY:-1}"
    # Debug: =1 checks every decode row's input token against the last committed token (one D2H
    # sync per step) and logs any context/emission divergence loudly. Off by default.
    MINISGL_FEEDBACK_CHECK: "${MINISGL_FEEDBACK_CHECK:-}"
    # Debug: every Nth eager decode-attention call recomputes the layer in torch fp32 from the same
    # paged KV and logs the worst rel error (attn parity tap). Empty = off.
    MINISGL_ATTN_PARITY_N: "${MINISGL_ATTN_PARITY_N:-}"
    # Debug: =1 serves every dense quant linear through the tiled/prefill kernel (decode GEMVs
    # bypassed) — corruption-bisection knob.
    MINISGL_FORCE_TILED_LINEARS: "${MINISGL_FORCE_TILED_LINEARS:-}"
    # Debug: every Nth GDN decode call logs max/median per-head ||S||_F vs the kernel's 1000 cap.
    MINISGL_SSM_NORM_LOG: "${MINISGL_SSM_NORM_LOG:-}"
    # Spec acceptance diagnostics: MINISGL_SPEC_DEBUG=1 logs [spec] accept_rate / emitted-per-step /
    # mean accept-len (every 50 steps + at request end). Default empty (off). Zero serve-path cost.
    MINISGL_SPEC_DEBUG: "${MINISGL_SPEC_DEBUG:-}"
    # Bounds on the prompt-prefill draft seed (scheduler.py::_spec_seed_fits). The seed forward keeps
    # last_hidden/aux_hidden live over the whole prefill span; unbounded, 8 concurrent ~11k-token
    # prompts OOM'd the scheduler inside the MoE gather-reduce. Defaults ARE the policy (512 = the
    # ~500-token crossover past which the seed was already measured net-negative, 5bd8d5a7/44960dd4);
    # these are forwarded to RE-MEASURE that crossover, not to configure a deployment. Set MAX_PROMPT=0
    # to disable seeding entirely (the control leg). NOTE the reader uses the `or` form, so the empty
    # string compose substitutes here falls back to the default instead of raising in float()/int().
    MINISGL_SPEC_SEED_MAX_PROMPT: "${MINISGL_SPEC_SEED_MAX_PROMPT:-}"
    MINISGL_SPEC_SEED_MAX_BATCH_TOKENS: "${MINISGL_SPEC_SEED_MAX_BATCH_TOKENS:-}"
    # MEASUREMENT INSTRUMENT ONLY: pin the adaptive verify width to one captured rung (3/7/15 at
    # K=16) so each rung's TRUE tok/s is measurable at fixed K. The controller optimizes accepted
    # tokens per STEP, but a wider rung costs more time per step, so emitted/step and tok/s can point
    # opposite ways — this is how that gets settled with data. Unset = normal adaptive behaviour.
    MINISGL_SPEC_VERIFY_WIDTH_PIN: "${MINISGL_SPEC_VERIFY_WIDTH_PIN:-}"
    # Row budget for the captured verify launch (spec/width.py, default 32) — a lever on the
    # dominant verify-path cost, so it has to be sweepable through the serve path.
    MINISGL_SPEC_VERIFY_ROW_BUDGET: "${MINISGL_SPEC_VERIFY_ROW_BUDGET:-}"
    # Batch-size gate: above this decode batch the step falls back to PLAIN decode, because spec is
    # measured net-negative there (verify costs bs*(width+1) rows vs plain's bs). Per-proposer
    # defaults live in scheduler.py::_SPEC_MAX_BS_BY_ALGO (MTP 4, DFlash 1 — both measured). Set 0 to
    # disable the gate, which is REQUIRED when measuring a crossover or the gate hides the points.
    MINISGL_SPEC_MAX_BS: "${MINISGL_SPEC_MAX_BS:-}"
    # MTP draft-KV ring window (spec/mtp.py). The buffer is max_slots*W, so W trades drafter context
    # for VRAM that goes straight back to the KV pool. Unset = 512 (measured equivalent to the old
    # _max_ctx 8192 at every depth tested, 3 MB instead of 50 — see spec/mtp.py's table); reproducing
    # the pre-ring behaviour/footprint needs an EXPLICIT 8192. NOT forwarding this made a W sweep
    # silently run three identical 8192 legs — the giveaway was the engine logging "draft-KV 50 MB"
    # for every W.
    MINISGL_MTP_KV_WINDOW: "${MINISGL_MTP_KV_WINDOW:-}"
    # Context length above which drafting is skipped (mtp.py / draft_model.py). Unset = unbounded —
    # the ring made every length drafts-capable, so this is an escape hatch, not a deployment knob.
    MINISGL_SPEC_MAX_CONTEXT: "${MINISGL_SPEC_MAX_CONTEXT:-}"
    # MINISGL_EXIT_AFTER_STEPS=<N>: run N scheduler-loop iterations then return from run_forever, so
    # the process exits NORMALLY. Diagnostics only; unset = serve forever. Required to profile inside
    # a captured CUDA graph: rocprofv3 is LD_PRELOADed into this very process (it is not a separate
    # process to stop) and flushes only on clean interpreter teardown, so no signal can produce a
    # trace. Set it BELOW the step count the driving request will reach, or the loop blocks idle
    # waiting for work and never reaches the bound.
    MINISGL_EXIT_AFTER_STEPS: "${MINISGL_EXIT_AFTER_STEPS:-}"
    # ROCTx phase markers + a gated collection window (python/minisgl/utils/roctx.py). MINISGL_ROCTX=1
    # wraps each spec step in propose/stage/verify_forward/accept ranges and calls
    # roctxProfilerResume/Pause around steps [SKIP, SKIP+STEPS), so `rocprofv3 --marker-trace
    # --selected-regions` records ONLY those steps and every dispatch is attributable to a phase.
    # Adds no synchronize (unlike MINISGL_SPEC_TIMING), so the profiled step keeps its real shape.
    MINISGL_ROCTX: "${MINISGL_ROCTX:-}"
    MINISGL_ROCTX_SKIP: "${MINISGL_ROCTX_SKIP:-}"
    MINISGL_ROCTX_STEPS: "${MINISGL_ROCTX_STEPS:-}"
    # PLAIN-decode loops only: "start:len,start:len,…" opens SEVERAL windows in one run, so one boot
    # can trace bs=1 and bs=8 (booting a 35B at TP=2 costs more than the measurement).
    MINISGL_ROCTX_WINDOWS: "${MINISGL_ROCTX_WINDOWS:-}"
    # Per-phase spec step timing: =1 logs [spec-timing] propose/stage/forward/accept ms every 50 steps
    # (cuda-synchronized, so these are real GPU times, not queue times). Already implemented in the
    # scheduler but never forwarded, so it could not be reached through compose — which is the only
    # way this repo serves. Diagnostic; costs 4 syncs/step when on.
    MINISGL_SPEC_TIMING: "${MINISGL_SPEC_TIMING:-}"
    # =0 reverts the fused MoE gemm2 to the bit-exact WMMA gemm2 + gather_reduce. Forwarded because
    # the fused path's atomic reduction order VARIES RUN TO RUN (quant/kernels.py says so in place),
    # which makes an MTP draft head — a MoE at M=1 — non-bit-reproducible against ITSELF. Any
    # bit-identity gate over a MoE drafter has to be able to turn that off, and through compose is
    # the only way this repo serves. Diagnostic; production keeps the fused default.
    MINISGL_MOE_G2FUSE: "${MINISGL_MOE_G2FUSE:-}"
    # DFlash drafter knobs the proposer reads. PERSIST_KV=0 falls back to re-projecting the whole
    # prefix each step (diagnostic). CTX_WINDOW is a scheduler-side cap on the accumulated aux; the
    # DEFAULT cap now comes from the drafter's own attention window (Proposer.aux_ctx_cap), so this
    # is only for forcing a SMALLER (and then not numerically inert) window.
    MINISGL_DFLASH_PERSIST_KV: "${MINISGL_DFLASH_PERSIST_KV:-}"
    MINISGL_DFLASH_CTX_WINDOW: "${MINISGL_DFLASH_CTX_WINDOW:-}"
    # Full-context drafter conditioning (scheduler.py:485, default 1). Forwarded because it is the
    # ONLY way to construct a working pre-change EAGLE3 reference: at d276137c this flag is not
    # gated on the proposer being DFlash, so ctx.aux_hidden is 3-D for EAGLE3 too and its first
    # decode step dies with a shape error. =0 restores the 2-D legacy aux and makes that baseline
    # servable. Inert on the current tree (the gate is fixed) — production keeps the default.
    MINISGL_DFLASH_FULLCTX: "${MINISGL_DFLASH_FULLCTX:-}"
    # Propose-ring sizing. All three MUST be declared here or they are SILENTLY INERT: compose passes
    # only the variables it lists, so setting them on the host looks like it worked and does nothing
    # — the same trap MINISGL_DRAFT_RESERVE* and MINISGL_DFLASH_CAPTURE_LAYERS already hit.
    #   RING_SLOTS       cap on ring slots. The ring costs slots x sum(per-layer capacity); on a 16 GB
    #                    card a 4096-window drafter at 5 slots is ~360 MB, which is enough to starve a
    #                    long generation's workspace. A request whose slot is outside the pool decodes
    #                    plain, so this trades drafted-concurrency for memory and never correctness.
    #   RING_HEADROOM_GB free memory to leave unspent when sizing the ring at boot.
    #   FULL_CAP         max-context cap for a `full_attention` layer's ring (it has no window).
    MINISGL_DFLASH_RING_SLOTS: "${MINISGL_DFLASH_RING_SLOTS:-}"
    MINISGL_DFLASH_RING_HEADROOM_GB: "${MINISGL_DFLASH_RING_HEADROOM_GB:-}"
    MINISGL_DFLASH_FULL_CAP: "${MINISGL_DFLASH_FULL_CAP:-}"
    MINISGL_DFLASH_REBUILD_CHUNK: "${MINISGL_DFLASH_REBUILD_CHUNK:-}"
    # Force the drafter's block mask causal (1) or bidirectional (0), overriding the per-layer rule
    # derived from `layer_types`. For a checkpoint that declares neither `dflash_config.causal` nor
    # `sliding_window_non_causal` this is the only way to measure the axis: vLLM/SGLang make
    # sliding-window layers causal, while z-lab's own reference is non-causal on every layer, and a
    # block-diffusion drafter is bidirectional within its block by construction.
    MINISGL_DFLASH_CAUSAL: "${MINISGL_DFLASH_CAUSAL:-}"
    # EAGLE3 drafter knobs — the same family as the DFlash set above, read INSIDE the container, so
    # an unlisted var is silently inert (the MTP_KV_WINDOW trap, recurred). CAPTURE_LAYERS and
    # AUX_MODE repeat their code defaults because those readers are not empty-string-safe (int("")
    # at import; "" != "xr" flips the aux capture); the rest use the `or` form and forward empty.
    MINISGL_EAGLE3_KV_WINDOW: "${MINISGL_EAGLE3_KV_WINDOW:-}"
    # Forwarded EMPTY: a non-empty default here would force the env-override path and defeat the
    # checkpoint-declared / target-depth-derived capture ids in draft_model.py (reader is
    # empty-string-safe).
    MINISGL_EAGLE3_CAPTURE_LAYERS: "${MINISGL_EAGLE3_CAPTURE_LAYERS:-}"
    MINISGL_EAGLE3_AUX_MODE: "${MINISGL_EAGLE3_AUX_MODE:-xr}"
    MINISGL_EAGLE3_TOK_OFF: "${MINISGL_EAGLE3_TOK_OFF:-0}"
    MINISGL_EAGLE3_POS_OFF: "${MINISGL_EAGLE3_POS_OFF:-0}"
    # ---- GPU fault localisation (empty = off; these are DIAGNOSTIC, not serving knobs) ----------
    # An HSA_STATUS_ERROR_EXCEPTION 0x1016 is an in-kernel memory fault reported asynchronously, so
    # by default the traceback points at whatever host call happened to sync next, not at the kernel
    # that faulted. AMD_SERIALIZE_KERNEL=3 + HIP_LAUNCH_BLOCKING=1 make the abort land ON the guilty
    # launch. This is how the previous 0x1016 on this box was localised (it turned out to be an
    # embedding lookup on a -1 token id), and it reproduced deterministically under serialisation.
    AMD_SERIALIZE_KERNEL: "${AMD_SERIALIZE_KERNEL:-}"
    HIP_LAUNCH_BLOCKING: "${HIP_LAUNCH_BLOCKING:-}"
    # IDLE BUSY-WAIT. `libhsa-runtime64.so`'s `rocr::core::Runtime::AsyncEventsLoop` parks in
    # `hsaKmtWaitOnMultipleEvents_ExtCtx`, and that wait POLLS rather than blocking — one thread per
    # RANK pinned at 100% of a core for as long as the serve is up, at idle, proportional to rank
    # count and not to load (measured 2026-09-15: 2 cores, 164 min of CPU each, on an idle TP=2
    # serve). It is NOT our scheduler: rank0 parks in `poll()` inside libzmq and rank1 in
    # `pthread_cond_wait` inside `c10d::Work::wait`, both correctly blocked, and the expert-cache
    # manager is on a 0.25 s `threading.Event.wait`.
    #
    # `HSA_ENABLE_INTERRUPT=1` asks the HSA runtime for interrupt-driven signal completion instead
    # of polling. EMPTY = the ROCm default (poll), so this entry changes nothing until it is set.
    # It is a TRADE, not a free win: interrupt delivery costs a few microseconds per completion
    # against a spin that is already hot. Noise on a ~50 ms/token decode loop; measure before
    # assuming it is free on anything latency-sensitive.
    #
    # Plumbed here because compose forwards ONLY declared names: exporting it on the host without
    # this line is silently dropped, and the serve looks unchanged for the wrong reason.
    HSA_ENABLE_INTERRUPT: "${HSA_ENABLE_INTERRUPT:-}"
    # MEASURED 2026-09-15: HSA_ENABLE_INTERRUPT=1 changed NOTHING — idle 201.4% -> 201.8% of a core
    # and TPOT 24.30 -> 24.30 ms on the 27B. The var reaches the rank (verified in /proc/<pid>/environ)
    # and the symbol exists in libhsa-runtime64.so, so it is accepted and ignored on this build.
    # Kept plumbed because it costs nothing and is the first thing anyone will reach for.
    #
    # HSA_ENABLE_MWAITX asks the runtime to park on AMD's MONITOR/MWAITX (a low-power wait) instead
    # of a bare spin. ALSO MEASURED, ALSO A DUD: idle 201.4% -> 210.4% (i.e. very slightly WORSE, and
    # inside run-to-run spread), TPOT 24.30 -> 24.38 ms. Both knobs are plumbed and both are inert on
    # ROCm 7.2.1; they are kept ONLY so the next person finds this note instead of re-running the
    # experiment. DO NOT set either expecting the idle core back.
    HSA_ENABLE_MWAITX: "${HSA_ENABLE_MWAITX:-}"
    # THE ACTUAL FIX for the idle spin, and it is not an HSA knob at all.
    #
    # torch ships its OWN `libhsa-runtime64.so` in `torch/lib/` (4,230,361 B) and loads it in
    # preference to the system ROCm one (`/opt/rocm/lib/libhsa-runtime64.so.1.18.70201`,
    # 4,248,144 B, different build). THE BUNDLED BUILD SPINS: its
    # `rocr::core::Runtime::AsyncEventsLoop` busy-polls in USER SPACE — 500/500 samples of
    # /proc/<tid>/syscall show "running", i.e. never in a syscall — from the first device
    # allocation onward, forever, one thread per rank. The system build does not, and starts one
    # fewer thread. That is why every HSA_* knob above measured inert: they were being read by a
    # build that polls regardless.
    #
    # MEASURED 2026-09-15 with a 10 s reproducer (torch.cuda.init + one tensor, then sleep):
    #   torch-bundled HSA   99.7% CPU, 19 threads        system HSA   0.1% CPU, 18 threads
    # and after real GPU work, with identical numerics and speed:
    #   matmul rel-err 1.985e-06 both;  2048^3 fp32  1.092 ms vs 1.087 ms;  idle 99.7% -> 0.0%
    #
    # Empty by default: this preloads a DIFFERENT HSA runtime under torch, which is a real ABI
    # surface, so it is opt-in until it has run a while. Set to
    # /opt/rocm/lib/libhsa-runtime64.so.1 to enable.
    LD_PRELOAD: "${LD_PRELOAD:-}"
    TORCH_USE_HIP_DSA: "${TORCH_USE_HIP_DSA:-}"
    # TiDAR logit-mixing "Trust-Diffusion" verify (fused-TiDAR path only): verify each draft position
    # against argmax(beta*p_ar + (1-beta)*R_i[0]). 1.0 (default) = the lossless-vs-AR-greedy path
    # (bit-identical); beta<1.0 leans on the diffusion self-draft for higher acceptance but is NOT
    # lossless. Inert for the non-TiDAR profiles here (they don't run the fused path). A tunable knob.
    MINISGL_TIDAR_MIX_BETA: "${MINISGL_TIDAR_MIX_BETA:-1.0}"
    # The rest of the SPEC=tidar family (spec/tidar.py / scheduler.py): BLOCK caps the draft block,
    # MASK_ID overrides the mask token id, FUSED/DDTREE/SEG/FUSED_NOREP pick the step variant. All
    # readers are empty-string-safe (`or` form / == "1"), so these forward empty.
    MINISGL_TIDAR_BLOCK: "${MINISGL_TIDAR_BLOCK:-}"
    MINISGL_TIDAR_MASK_ID: "${MINISGL_TIDAR_MASK_ID:-}"
    MINISGL_TIDAR_FUSED: "${MINISGL_TIDAR_FUSED:-}"
    MINISGL_TIDAR_DDTREE: "${MINISGL_TIDAR_DDTREE:-}"
    MINISGL_TIDAR_SEG: "${MINISGL_TIDAR_SEG:-}"
    MINISGL_TIDAR_FUSED_NOREP: "${MINISGL_TIDAR_FUSED_NOREP:-}"
    # torch.profiler window (diagnostic): MINISGL_PROFILE=<path under /engine> captures SKIP..SKIP+STEPS
    # forward/verify steps into a chrome trace. Inert unless set. Point at /engine/... so it lands in
    # the mounted worktree; name it *.pt.trace.json.gz so torch gzips it and TraceLens ingests it.
    MINISGL_PROFILE: "${MINISGL_PROFILE:-}"
    MINISGL_PROFILE_SKIP: "${MINISGL_PROFILE_SKIP:-40}"
    MINISGL_PROFILE_STEPS: "${MINISGL_PROFILE_STEPS:-50}"
    # Phase-1 comms/compute overlap: split the fused MoE shared+routed TP all_reduce into 2 disjoint
    # row-chunks and hide chunk-0's collective (side stream, RCCL) behind chunk-1's expert GEMM. Eager
    # prefill only, bit-exact (disjoint rows) — measured +4.3% prefill TTFT @M1. Default ON; =0 to disable.
    MINISGL_MOE_ASYNC_AR: "${MINISGL_MOE_ASYNC_AR:-1}"
    MINISGL_MOE_ASYNC_AR_MIN_TOKENS: "${MINISGL_MOE_ASYNC_AR_MIN_TOKENS:-512}"
    # Recurrent-radix snapshot store — the two knobs that decide how much VRAM prefix reuse costs.
    # LADDER = interior resume points kept per sequence (engine default 4). It is also the FLOOR term
    # in the store's cap: (ladder+1) * max_running snapshots, 16.4 MiB each on the 35B, so 4 -> 20
    # snapshots -> ~0.33 GiB reserved OUT OF the same budget the KV pool is sized from. Lower it to
    # trade interior resume points for pool tokens; 0 keeps only the end-of-sequence snapshot.
    # BUDGET_GIB caps the store above that floor (engine default 0.375) — cross-request reuse only.
    # Both were readable by the engine but not forwarded, so neither could be reached through compose
    # (and therefore not from the control panel either). Empty = engine default.
    MINISGL_GDN_RADIX_SNAP_LADDER: "${MINISGL_GDN_RADIX_SNAP_LADDER:-}"
    MINISGL_GDN_RADIX_SNAP_BUDGET_GIB: "${MINISGL_GDN_RADIX_SNAP_BUDGET_GIB:-}"

services:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # GENERIC RUNNER — the ONE correct way to run ANY test / benchmark / compile / probe / hello-world
  # in a WORKING container: correct image (minisgl-rdna4:lean), correct kernels (/opt/kernels — baked,
  # always consistent with source), ROCm device passthrough, HF cache, and the lease-injected card set.
  # DO NOT hand-roll `docker run` for these — every hand-rolled run has gotten the kernel path wrong
  # (stale live /kernels -> gdn_decode_gated missing, fp8_wmma symlink, etc.). Use THIS.
  #
  #   Self-test (proves image+HIP+kernels all load — run this first when anything looks broken):
  #     gpu-lease -n 1 -- docker compose --profile run run --rm run
  #   Run anything (env MINISGL_CMD is the command; single-quote it):
  #     MINISGL_CMD='python /engine/tools/serve_matrix_bench.py --help' \
  #       gpu-lease -n 1 -- docker compose --profile run run --rm run
  #   Compile a kernel into the canonical repo (CPU only, no lease needed — /kernels is mounted RW):
  #     MINISGL_CMD='cd /kernels/gdn && GPU_ARCHS=gfx1201 bash local/build_local.sh' \
  #       docker compose --profile run run --rm run
  #   TP=2 job: gpu-lease -n 2 -- ...   (the arbiter injects both cards via LEASE_*_DEVICES).
  #
  # Kernels default to the baked /opt/kernels (PYTHONPATH from *lean-env). The canonical repo is ALSO
  # mounted at /kernels for COMPILING or testing local kernel edits — after you build there, set
  # MINISGL_CMD to prepend PYTHONPATH=/kernels/_kernels for that one run.
  run:
    <<: *lean-common
    profiles: ["run"]
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/ai/hf}:/root/.cache/huggingface
      - ${RDNA4_HIP_KERNELS:-/home/pat/code/rdna4-hip-kernels}:/kernels
      # Magpie/metrix site-packages at the path profile_kernel.sh expects (MX_SITE_PACKAGES=/mx).
      # Without this the runner cannot host a profiling run, which forced agents back to hand-rolled
      # `docker run` for exactly the workload where getting the mounts right matters most.
      - ${MAGPIE_SITE_PACKAGES:-/home/pat/code/Magpie/.venv/lib/python3.12/site-packages}:/mx:ro
      # The box-wide rocprofv3 mutex must be the SAME file inside the container as outside, or two
      # profiling runs in different containers will not see each other and will SIGABRT.
      - /home/pat/code/vllm-gfx1201/.gpu-locks:/home/pat/code/vllm-gfx1201/.gpu-locks
    entrypoint: ["bash", "-lc"]
    command:
      - ${MINISGL_CMD:-python /engine/tools/container_selftest.py}

  # vllm 0.24 + full HIP kernels — the PERFORMANT Qwen3.6-35B serve (measured 82.3 tok/s bs=1 decode
  # vs minisglang ~47, no-spec; stock-Triton ceiling 92). Runs the BEST current gdn_hip state by
  # DEFAULT: stride-aware gdn_hip_C.so (indexes the paged mamba cache in place, no fp32 full-cache
  # copy) + paged/cast-free glue + bf16 SSM state (halves recurrent-state HBM). Progression that got
  # here: 24 (baked fp32 full-cache copy) -> 72 (slot-copy) -> 79.6 (stride paged) -> 81.6 (cast-free)
  # -> 81.8 (bf16 ssm) -> 82.3 (fused conv+decode). Remaining 81.8->92 is decode launch/gap structure (~1478 dispatches/token).
  # Run (lease-bound so the janitor never reaps it):
  #     gpu-lease -n 2 --detach --name vhip -- docker compose --profile vhip up -d
  #     docker compose -p lease-vhip logs -f          # watch boot (~2.5 min, no 30-min GDN autotune)
  #     curl localhost:8000/v1/chat/completions ...    # served model name: "x"
  #     docker compose -p lease-vhip down              # stop + release lease
  # Rebuild the stride-aware .so after editing rdna4-hip-kernels/gdn:  bash gdn/local/build_local.sh
  # (inside the image toolchain). To A/B a HIP kernel: set VLLM_PLUGINS (whitelist) /
  # VLLM_ATTENTION_BACKEND (ROCM_HIP_ATTN|TRITON_ATTN); to fall back to the baked (slow fp32-copy) glue
  # set VHIP_GLUE_DST=/tmp/x VHIP_SO_DST=/tmp/y.  Port 8000; probe: tools/msgl_probe.py <pre> <gen> 8000.
  vhip:
    <<: *lean-common
    image: vllm24-hip:combined
    profiles: ["vhip"]
    ports:
      - "8000:8000"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/ai/hf}:/root/.cache/huggingface
      # DEFAULT ON: paged-aware gdn_hip glue over the baked (slow, fp32-full-cache-copy) one.
      - ${VHIP_GLUE_SRC:-/home/pat/code/minisgl-rdna4/tools/profiling/vllm_oot_slotfix.py}:${VHIP_GLUE_DST:-/usr/local/lib/python3.12/dist-packages/gdn_vllm/vllm_oot.py}:ro
      # DEFAULT ON: rebuilt stride-aware gdn_hip_C.so over the baked contiguous-only one.
      - ${VHIP_SO_SRC:-/home/pat/code/rdna4-hip-kernels/gdn/torch-ext/gdn_hip/gdn_hip_C.cpython-312-x86_64-linux-gnu.so}:${VHIP_SO_DST:-/opt/kernels/gdn_hip/gdn_hip_C.cpython-312-x86_64-linux-gnu.so}:ro
      # DEFAULT ON: bf16 SSM state (conv stays fp32) — halves recurrent-state traffic vs the forced-fp32 baked register.
      - ${VHIP_REG_SRC:-/home/pat/code/minisgl-rdna4/tools/profiling/register_bf16ssm.py}:${VHIP_REG_DST:-/usr/local/lib/python3.12/dist-packages/gdn_vllm/register.py}:ro
    # bash-array command so an optional --speculative-config JSON (VHIP_SPEC) can be appended without
    # bash brace-expanding/word-splitting its {"...":...} — the `$$` are passed through by compose and
    # evaluated in-container at runtime. VHIP_SPEC presets (spec-decode; needs memory headroom — drop
    # --max-model-len / --gpu-memory-utilization if it OOMs on KV):
    #   MTP    (native, Qwen3.6 MTP head):  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}'
    #          — VALIDATED loads+serves, but MEASURED NET-NEGATIVE at bs=1 (~28 tok/s vs 82 plain:
    #            propose ~5x, accept ~1.9). May pay off at higher concurrency / a better drafter.
    #   DFlash (drafter must be vLLM/EAGLE3-loadable; the ZAYA/minisgl DFlash drafters are NOT — they
    #           are minisgl-native, so DFlash here needs an EAGLE3-format Qwen drafter checkpoint):
    #            VHIP_SPEC='{"method":"eagle3","model":"<eagle3-drafter-path>","num_speculative_tokens":3}'
    #   draft-model form (any vLLM-loadable small model):  VHIP_SPEC='{"model":"<drafter>","num_speculative_tokens":3}'
    # e.g.  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}' gpu-lease -n 2 --detach --name vhip -- docker compose --profile vhip up -d
    entrypoint: ["bash", "-lc"]
    command:
      - |
        args=("$${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
          --host 0.0.0.0 --port 8000 --tensor-parallel-size 2
          --max-model-len "$${VHIP_MAXLEN:-60000}" --kv-cache-dtype fp8 --dtype float16
          --max-num-batched-tokens 2048 --max-num-seqs "$${VHIP_MNS:-8}"
          --gpu-memory-utilization "$${VHIP_MEM:-0.92}"
          --language-model-only
          --served-model-name x --trust-remote-code)
        if [ -n "$${VHIP_SPEC:-}" ]; then args+=(--speculative-config "$${VHIP_SPEC}"); fi
        # Prefix caching: default ON (VHIP_PREFIX_CACHE=1) — a serve that re-prefills every turn is
        # mostly useless. vLLM auto-disables it for a HYBRID GDN model, so we force it on, which puts
        # the mamba cache in experimental 'align' mode (attn block padded up to the GDN page + a full
        # conv+ssm GDN state snapshot reserved PER KV block). MoE 35B fits at VHIP_MNS<=4. On a DENSE-GDN
        # model (Qwen 27B) that per-block state ~doubles the footprint and can overcommit the 16GB card
        # ("No available memory for the cache blocks") — trim VHIP_MNS / VHIP_MAXLEN, or VHIP_PREFIX_CACHE=0.
        pc="$${VHIP_PREFIX_CACHE}"; [ "$$pc" = 1 ] && args+=(--enable-prefix-caching)
        # reasoning parser (<think> -> reasoning_content), tool-call parser + auto tool-choice, and the
        # checkpoint's preserve_thinking chat-template kwarg. Defaults live in the environment block below
        # (a bash ${VAR:-default} silently drops here). Set any of these env vars to "off" to skip.
        rp="$${VHIP_REASONING_PARSER}"; [ "$$rp" != off ] && [ -n "$$rp" ] && args+=(--reasoning-parser "$$rp")
        tp="$${VHIP_TOOL_PARSER}"
        if [ "$$tp" != off ] && [ -n "$$tp" ]; then
          args+=(--tool-call-parser "$$tp")
          [ "$${VHIP_TOOL_CHOICE}" = 1 ] && args+=(--enable-auto-tool-choice)
        fi
        ctk="$${VHIP_CHAT_TEMPLATE_KWARGS}"; [ "$$ctk" != off ] && [ -n "$$ctk" ] && args+=(--default-chat-template-kwargs "$$ctk")
        echo "[vhip] spec=$${VHIP_SPEC:-none} reasoning=$${rp:-off} tools=$${tp:-off} auto-tool-choice=$${VHIP_TOOL_CHOICE} ctk=$${ctk:-off}"
        exec /app/tools/image_entrypoint.sh "$${args[@]}"
    environment:
      <<: *lean-env
      PYTHONPATH: /opt/kernels
      NCCL_P2P_DISABLE: "1"
      NCCL_PROTO: Simple
      VLLM_PLUGINS: "${VLLM_PLUGINS:-gdn_hip,tail_hip_register,w4a8_fp8_wmma_register}"
      VLLM_ATTENTION_BACKEND: "${VLLM_ATTENTION_BACKEND:-}"
      # spec-decode + serve tunables (empty -> in-container defaults above). Set VHIP_SPEC to a
      # --speculative-config JSON (see presets above) to enable MTP / DFlash / draft-model spec.
      MINISGL_MODEL: "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
      VHIP_SPEC: "${VHIP_SPEC:-}"
      VHIP_MAXLEN: "${VHIP_MAXLEN:-}"
      VHIP_MNS: "${VHIP_MNS:-}"
      VHIP_MEM: "${VHIP_MEM:-}"
      # prefix caching default ON (a serve without it re-prefills every turn). For a hybrid GDN model
      # this uses experimental mamba 'align' mode; if it overcommits (dense GDN, long ctx), lower
      # VHIP_MNS / VHIP_MAXLEN, or set VHIP_PREFIX_CACHE=0 to disable.
      VHIP_PREFIX_CACHE: "${VHIP_PREFIX_CACHE:-1}"
      # reasoning/tool parsing — Qwen3.6 defaults; set to "off" to skip either,
      # VHIP_TOOL_CHOICE=0 to drop --enable-auto-tool-choice.
      VHIP_REASONING_PARSER: "${VHIP_REASONING_PARSER:-qwen3}"
      VHIP_TOOL_PARSER: "${VHIP_TOOL_PARSER:-qwen3_coder}"
      VHIP_TOOL_CHOICE: "${VHIP_TOOL_CHOICE:-1}"
      # server-wide chat-template kwargs (JSON) — preserve_thinking keeps prior-turn <think> blocks in
      # the rendered context (the checkpoint template's kwarg). Set "off" to omit.
      VHIP_CHAT_TEMPLATE_KWARGS: '${VHIP_CHAT_TEMPLATE_KWARGS:-{"preserve_thinking": true}}'

  vllm:
    <<: *lean-common
    image: tcclaviger/vllm:latest
    profiles: ["vllm"]
    ports:
      - "8000:8000"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/ai/hf}:/root/.cache/huggingface
    # bash-array command so an optional --speculative-config JSON (VHIP_SPEC) can be appended without
    # bash brace-expanding/word-splitting its {"...":...} — the `$$` are passed through by compose and
    # evaluated in-container at runtime. VHIP_SPEC presets (spec-decode; needs memory headroom — drop
    # --max-model-len / --gpu-memory-utilization if it OOMs on KV):
    #   MTP    (native, Qwen3.6 MTP head):  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}'
    #          — VALIDATED loads+serves, but MEASURED NET-NEGATIVE at bs=1 (~28 tok/s vs 82 plain:
    #            propose ~5x, accept ~1.9). May pay off at higher concurrency / a better drafter.
    #   DFlash (drafter must be vLLM/EAGLE3-loadable; the ZAYA/minisgl DFlash drafters are NOT — they
    #           are minisgl-native, so DFlash here needs an EAGLE3-format Qwen drafter checkpoint):
    #            VHIP_SPEC='{"method":"eagle3","model":"<eagle3-drafter-path>","num_speculative_tokens":3}'
    #   draft-model form (any vLLM-loadable small model):  VHIP_SPEC='{"model":"<drafter>","num_speculative_tokens":3}'
    # e.g.  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}' gpu-lease -n 2 --detach --name vllm -- docker compose --profile vllm up -d
    entrypoint: ["bash", "-lc"]
    command:
      - |
        args=("$${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
          --host 0.0.0.0 --port 8000 --tensor-parallel-size 2
          --max-model-len "$${VHIP_MAXLEN:-60000}" --kv-cache-dtype fp8 --dtype float16
          --max-num-batched-tokens 2048 --max-num-seqs "$${VHIP_MNS:-8}"
          --gpu-memory-utilization "$${VHIP_MEM:-0.92}"
          --language-model-only
          --served-model-name x --trust-remote-code)
        if [ -n "$${VHIP_SPEC:-}" ]; then args+=(--speculative-config "$${VHIP_SPEC}"); fi
        # Prefix caching: default ON (VHIP_PREFIX_CACHE=1) — a serve that re-prefills every turn is
        # mostly useless. vLLM auto-disables it for a HYBRID GDN model, so we force it on, which puts
        # the mamba cache in experimental 'align' mode (attn block padded up to the GDN page + a full
        # conv+ssm GDN state snapshot reserved PER KV block). MoE 35B fits at VHIP_MNS<=4. On a DENSE-GDN
        # model (Qwen 27B) that per-block state ~doubles the footprint and can overcommit the 16GB card
        # ("No available memory for the cache blocks") — trim VHIP_MNS / VHIP_MAXLEN, or VHIP_PREFIX_CACHE=0.
        pc="$${VHIP_PREFIX_CACHE}"; [ "$$pc" = 1 ] && args+=(--enable-prefix-caching)
        # reasoning parser (<think> -> reasoning_content), tool-call parser + auto tool-choice, and the
        # checkpoint's preserve_thinking chat-template kwarg. Defaults live in the environment block below
        # (a bash ${VAR:-default} silently drops here). Set any of these env vars to "off" to skip.
        rp="$${VHIP_REASONING_PARSER}"; [ "$$rp" != off ] && [ -n "$$rp" ] && args+=(--reasoning-parser "$$rp")
        tp="$${VHIP_TOOL_PARSER}"
        if [ "$$tp" != off ] && [ -n "$$tp" ]; then
          args+=(--tool-call-parser "$$tp")
          [ "$${VHIP_TOOL_CHOICE}" = 1 ] && args+=(--enable-auto-tool-choice)
        fi
        ctk="$${VHIP_CHAT_TEMPLATE_KWARGS}"; [ "$$ctk" != off ] && [ -n "$$ctk" ] && args+=(--default-chat-template-kwargs "$$ctk")
        echo "[vhip] spec=$${VHIP_SPEC:-none} reasoning=$${rp:-off} tools=$${tp:-off} auto-tool-choice=$${VHIP_TOOL_CHOICE} ctk=$${ctk:-off}"
        exec /app/tools/image_entrypoint.sh "$${args[@]}"
    environment:
      <<: *lean-env
      PYTHONPATH: /opt/kernels
      NCCL_P2P_DISABLE: "1"
      NCCL_PROTO: Simple
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "1"
      VLLM_ATTENTION_BACKEND: "${VLLM_ATTENTION_BACKEND:-}"
      # spec-decode + serve tunables (empty -> in-container defaults above). Set VHIP_SPEC to a
      # --speculative-config JSON (see presets above) to enable MTP / DFlash / draft-model spec.
      MINISGL_MODEL: "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
      VHIP_SPEC: "${VHIP_SPEC:-}"
      VHIP_MAXLEN: "${VHIP_MAXLEN:-}"
      VHIP_MNS: "${VHIP_MNS:-}"
      VHIP_MEM: "${VHIP_MEM:-}"
      # prefix caching default ON (a serve without it re-prefills every turn). For a hybrid GDN model
      # this uses experimental mamba 'align' mode; if it overcommits (dense GDN, long ctx), lower
      # VHIP_MNS / VHIP_MAXLEN, or set VHIP_PREFIX_CACHE=0 to disable.
      VHIP_PREFIX_CACHE: "${VHIP_PREFIX_CACHE:-1}"
      # reasoning/tool parsing — Qwen3.6 defaults; set to "off" to skip either,
      # VHIP_TOOL_CHOICE=0 to drop --enable-auto-tool-choice.
      VHIP_REASONING_PARSER: "${VHIP_REASONING_PARSER:-qwen3}"
      VHIP_TOOL_PARSER: "${VHIP_TOOL_PARSER:-qwen3_coder}"
      VHIP_TOOL_CHOICE: "${VHIP_TOOL_CHOICE:-1}"
      # server-wide chat-template kwargs (JSON) — preserve_thinking keeps prior-turn <think> blocks in
      # the rendered context (the checkpoint template's kwarg). Set "off" to omit.
      VHIP_CHAT_TEMPLATE_KWARGS: '${VHIP_CHAT_TEMPLATE_KWARGS:-{"preserve_thinking": true}}'

  # Default: Qwen3.6-35B-A3B-AWQ (W4A8 MoE) on the native-HIP Triton-free path, radix prefix cache.
  # GRAPH-CAPTURED decode (cuda-graph-max-bs 8, max-running 8): eager MoE decode leaves ~45% of device
  # time in host-launched gather/scatter/topk glue that serializes with the custom_ar all-reduce spins,
  # so eager conc-4 pulls only ~70 tok/s / ~120W while the graph-captured path hits ~100 tok/s / ~250-284W
  # at 100% util (measured 2026-07-16, 35B AWQ TP=2). max-running==cuda-graph-max-bs so EVERY admissible
  # decode batch (buckets [1,2,4,8]) is captured — none falls back to eager — and 8 covers the real-trace
  # concurrency peak (~7). Was cuda-graph-max-bs=0 (uniformly eager) — that was the latent 120W config.
  # THE minisgl serve service. Pick a model, a spec mode, a parallelism, a context length and a
  # concurrency — tools/serve.sh maps those onto the engine's flags and owns the per-model table
  # (checkpoint, attention backend, DFlash draft path, tuned draft length).
  #
  #   MODEL=qwen35b-awq|qwen35b-mxfp4|glm|laguna|zaya|<any HF id or /models path>
  #   SPEC=none|mtp|dflash|eagle3|ngram    SPEC_K=<n>
  #   TP=2  DP=1  EP=0                     CTX=<tokens>   CONC=<n>
  #
  # Overrides for everything else: ATTN MEM_RATIO GRAPH_BS PAGE_SIZE CACHE_TYPE DRAFT EXTRA_ARGS.
  # `DRY_RUN=1 tools/serve.sh` prints the composed launch line without running it.
  #
  # This REPLACED nine near-identical services (serve, qwen, glm, qwen35b-mtp, qwen35b-dflash,
  # laguna, laguna-dflash, laguna-radix, zaya) that ran the SAME command and differed only by the
  # values above — so every new model or spec mode meant another copy-pasted 40-line block, and the
  # combinations nobody had pre-baked (laguna+mtp, glm+DP+EP, anything with DP or EP at all) simply
  # did not exist. The variation is a table, and the table lives in tools/serve.sh.
  serve:
    <<: *lean-common
    profiles: ["serve"]
    container_name: ${LEASE_NAME:-minisgl-lean}-serve
    # "no", NOT unless-stopped: A RESTART POLICY OUTLIVES THE GPU LEASE.
    #
    # The lease is bound to a PROCESS (`gpu-lease --detach` ties it to container lifetime); the
    # container is bound to Docker's restart policy. Those are not the same lifetime, and under
    # `unless-stopped` they come apart in the dangerous direction: the lease-holding process dies,
    # the flock releases, and Docker then brings the container back up — on both cards, with
    # `gpu-status` reporting them FREE. Another agent leasing a card collides with a serve the
    # arbiter cannot see. `docker compose down` is the only thing that clears it, because `stop`
    # leaves the policy armed.
    #
    # Observed repeatedly on 2026-09-10/11: every failed boot (a crash, a placement error, a rank
    # exception) left a container Docker kept resurrecting unleased, each time noticed only by
    # chance. The policy was also actively harmful during a crash LOOP — a serve that dies at boot
    # restarts forever, holding the lease and burning the cards, instead of failing once and
    # freeing them.
    #
    # A supervised production serve wants a restart policy; a LEASED one must not have one, because
    # the arbiter, not Docker, owns when this may run. The `*lean-common` anchor already says "no";
    # this service used to override it.
    restart: "no"
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/ai/hf}:/root/.cache/huggingface
      # Local checkpoints (ZAYA, Laguna) and DFlash drafts, so a model alias can name a path.
      - ${MODELS_DIR:-/home/pat/models}:/models
      - ${DRAFT_DIR:-/home/pat/code/_models}:/drafts:ro
      # This service REDEFINES volumes rather than inheriting *lean-common's, so /ghost has to be
      # repeated here — the anchor's copy does not merge in. Durable host path; see the anchor.
      - ${GHOST_ORACLE_DIR:-/home/pat/fixtures/minisgl-ghost-oracle}:/ghost
      # qwen4_exp (Qwen3.8-Flash-Next NVFP4) is a LOCAL checkpoint in two parts, and serve.sh's
      # arm preflights BOTH: the expert stacks ship as per-layer shard files under /model, and the
      # 51.2 GB n-gram table is a separate sidecar under /ple that stays NVMe-resident (mmap'd by
      # weights/row_table.py, never streamed into VRAM). Without these two the arm dies in preflight
      # with "none matched /ple/model-plefp8-*.safetensors" — which is what a panel launch hit on
      # 2026-09-06, because the measured runs mounted them by hand in tools/qsa/run_qsa_longctx.sh
      # and that never made it into the compose service every other model serves from.
      # Read-only: a serve has no business writing to either.
      - ${Q4E_MODEL_DIR:-/home/pat/ai/hf/q4e}:/model:ro
      - ${Q4E_PLE_DIR:-/home/pat/ai/ple}:/ple:ro
    environment:
      <<: *lean-env
      MODEL: "${MODEL:-qwen35b-awq}"
      # Short ALIAS to advertise in /v1/models (--served-model-name). Empty => serve.sh's
      # per-model table decides (the BASE model name, e.g. Qwen3.8-27B, so swapping checkpoint
      # quants doesn't change the name clients use). Set to force a specific alias.
      SERVED_NAME: "${SERVED_NAME:-}"
      SPEC: "${SPEC:-}"
      SPEC_K: "${SPEC_K:-}"
      TP: "${TP:-2}"
      DP: "${DP:-1}"
      EP: "${EP:-0}"
      CTX: "${CTX:-}"
      CONC: "${CONC:-4}"
      ATTN: "${ATTN:-}"
      MEM_RATIO: "${MEM_RATIO:-}"
      GRAPH_BS: "${GRAPH_BS:-}"
      PAGE_SIZE: "${PAGE_SIZE:-}"
      CACHE_TYPE: "${CACHE_TYPE:-}"
      DRAFT: "${DRAFT:-}"
      # Chunked-prefill chunk size. Pinned to 2048 as the SERVICE default (serve.sh carries the same
      # default and the measurement behind it): the engine's own 8192 reproducibly kills the worker
      # mid-forward on wide-activation models — gemma-4-26B-A4B took a ~7k-token prompt as one chunk
      # and OOM'd with devfree at 0. Overridable per launch (MAX_PREFILL_LENGTH=8192) for a model
      # with the headroom to want bigger chunks.
      # EMPTY passthrough, not a 2048 default: serve.sh's per-model table must win. A literal
      # default here is EXPORTED into the container, so an arm's `: "${MAX_PREFILL_LENGTH:=1024}"`
      # (qwen4_exp, where 1024 is a FEASIBILITY term for the QSA selection workspace, not a tuning
      # knob) never fires and the arm silently serves at 2048. serve.sh still applies the global
      # 2048 default for every model that wants it. Caught 2026-09-06 by diffing the live [serve]
      # banner against DRY_RUN — the only way this class of shadowing is visible.
      # Weight-offload tier, per rank. Empty = serve.sh's per-model table decides. These were not
      # reachable from a compose serve, so the placement decision the whole offload design exists to
      # make could only be exercised by hand — which is how the arm ended up shipping an 11/48-layer
      # device tier (f=0.229) that was never checked against the plan's own A0.4 gate of >=40% byte
      # hit rate. Plumbed 2026-09-07 to bring up the all-host (T1) configuration.
      # Host-arena capacity floor, GiB. A BOX property, not a model one. serve.sh defaults it to 9;
      # the gate that uses it is BLIND TO THE ZFS ARC (which is not in MemAvailable and which the
      # shrinker hands back under pinning), so a refusal at 9 can be the gate being wrong rather than
      # the box being full — check /proc/spl/kstat/zfs/arcstats before believing it.
      # Comms/compute overlap for the MoE all-reduce. EMPTY = the engine's default (ON). Plumbed
      # because the CPU-compute expert tier runs INSIDE `rowchunked_ar_span`, whose async collectives
      # live on a side stream, while `cpu_forward`'s blocking D2H is a host sync in the middle of that
      # region — a combination that DEADLOCKED both ranks at TP=2 (both blocked in `_ep_route`'s
      # torch.topk, card 1 pinned at 100% with a collective that never completed). Set 0 to take the
      # plain-all_reduce path. Empty is safe: the engine tests `!= "0"`, not truthiness.
      MINISGL_TP_OVERLAP: "${MINISGL_TP_OVERLAP:-}"
      MINISGL_WEIGHT_ARENA_FLOOR_GIB: "${MINISGL_WEIGHT_ARENA_FLOOR_GIB:-}"
      WOFF_DEVICE_GB: "${WOFF_DEVICE_GB:-}"
      WOFF_HOST_GB: "${WOFF_HOST_GB:-}"
      WOFF_CHUNK_MIB: "${WOFF_CHUNK_MIB:-}"
      # ---- CPU-COMPUTE EXPERT TIER ---------------------------------------------------------------
      # NONE of these reached a compose serve before 2026-09-08, which is the five-hops trap again
      # and it invalidated an instrument rather than a feature: the CPU-tier harness exported
      # MINISGL_CPU_MOE_STATS=200 for four legs and the container never saw it, so every one of
      # those runs reported an EMPTY "[cpu-moe] counters" section and the per-layer cost of the tier
      # -- the only number that separates "the AVX-512 kernel is slow" from "the submit/join handoff
      # is slow" -- was never actually collected. `engaged()` is a set and saturates at one, so it
      # cannot stand in for these.
      # Threads (= PINNED PHYSICAL CORES) per rank; engine default 2. The node-wide total is
      # refused by `cpu_tier.CoreBudget` unless _CORE_BUDGET below raises the cap.
      # Downgrades serve.sh's min_tp refusal to a warning. Needed here because serve.sh runs
      # INSIDE the container, so setting it on the host does nothing without this entry.
      MINISGL_ALLOW_TP_BELOW_MIN: "${MINISGL_ALLOW_TP_BELOW_MIN:-}"
      # ---- routing-trace oracle (MEASURE-ONLY, default OFF) ---------------------------------
      # An EXPLICIT directory, never a default into the repo layer (ghost_cache.py convention).
      # Unset arrives SET-BUT-EMPTY through compose, which the module handles via env_int.
      # ---- per-expert VRAM residency cache (--expert-cache-gb; these are TUNING, not gates) ----
      # MAX_INFLIGHT is the one that matters and it is a two-sided constraint, measured both ways:
      # unbounded, the cold fill queues thousands of copies and starves the forward's OWN expert
      # streaming over the same card-1-gated link (4,418 in flight -> the serve jammed); at 64 the
      # fill can never complete, because the forward already saturates PCIe and only ~1 copy lands
      # per step (448 promotions in 513 steps, fill stuck at 0.099).
      # NCCL watchdog, seconds. serve.sh sets 600 for the qwen4exp all-host arm (six legs died at
      # the 60 s default). Empty keeps the per-arm value from serve.sh's table.
      DIST_TIMEOUT: "${DIST_TIMEOUT:-}"
      # The knob that ENABLES the expert cache. Without it the four MINISGL_EXPERT_CACHE_*
      # tuning vars below govern a feature that is never switched on (--expert-cache-gb
      # defaults to 0.0 and serve.sh never emitted it until 2026-09-11).
      EXPERT_CACHE_GB: "${EXPERT_CACHE_GB:-}"
      MINISGL_EXPERT_CACHE_MAX_INFLIGHT: "${MINISGL_EXPERT_CACHE_MAX_INFLIGHT:-}"
      MINISGL_EXPERT_CACHE_LOW_WATER: "${MINISGL_EXPERT_CACHE_LOW_WATER:-}"
      MINISGL_EXPERT_CACHE_INFLIGHT_AGE: "${MINISGL_EXPERT_CACHE_INFLIGHT_AGE:-}"
      MINISGL_EXPERT_CACHE_REPORT: "${MINISGL_EXPERT_CACHE_REPORT:-}"
      MINISGL_MOE_ROUTE_TRACE: "${MINISGL_MOE_ROUTE_TRACE:-}"
      MINISGL_MOE_ROUTE_TRACE_RING: "${MINISGL_MOE_ROUTE_TRACE_RING:-}"
      MINISGL_MOE_ROUTE_TRACE_DRAIN: "${MINISGL_MOE_ROUTE_TRACE_DRAIN:-}"
      MINISGL_MOE_ROUTE_TRACE_MAX: "${MINISGL_MOE_ROUTE_TRACE_MAX:-}"
      MINISGL_MOE_ROUTE_TRACE_PREFILL: "${MINISGL_MOE_ROUTE_TRACE_PREFILL:-}"
      MINISGL_MOE_ROUTE_TRACE_BLOCKMAP: "${MINISGL_MOE_ROUTE_TRACE_BLOCKMAP:-}"
      MINISGL_CPU_MOE_THREADS: "${MINISGL_CPU_MOE_THREADS:-}"
      # Explicit physical-core list, overriding the derived per-rank range. Needed for any pool wide
      # enough to want core 0 (the derived list reserves it for the engine and refuses to run off
      # the end of the physical cores into the SMT siblings). Split across ranks in order.
      MINISGL_CPU_MOE_CORES: "${MINISGL_CPU_MOE_CORES:-}"
      # Print the seam's own counters every N layer-calls. This is the decomposition instrument.
      MINISGL_CPU_MOE_STATS: "${MINISGL_CPU_MOE_STATS:-}"
      # Override the node-wide physical-core cap. Unset = the measured refusal (8 physical - 1.88
      # engine - 0.5 OS = 5). Set only to deliberately overcommit for a sweep, and read the
      # per-layer counters when you do -- an oversubscribed pool does not degrade in proportion, it
      # goes to a FIXED ~6.0 ms/layer (docs/CPU_MOE_OFFLOAD.md §1.5).
      MINISGL_CPU_MOE_CORE_BUDGET: "${MINISGL_CPU_MOE_CORE_BUDGET:-}"
      MAX_PREFILL_LENGTH: "${MAX_PREFILL_LENGTH:-}"
      # torch allocator config. Loading streams each checkpoint tensor, slices the rank shard and
      # frees the rest, which leaves the heap fragmented: on Qwen3.8-27B-NVFP4 torch reserved 14.13
      # GiB for 11.62 GiB of tensors, and the empty_cache() before KV sizing dropped `reserved` to
      # 11.81 WITHOUT the device taking the memory back — so the engine billed 14.18 GiB of `model`
      # and the KV pool shrank to 25k tokens. expandable_segments grows/returns one virtual range
      # instead of many fixed segments, which is the documented fix for exactly that shape.
      PYTORCH_HIP_ALLOC_CONF: "${PYTORCH_HIP_ALLOC_CONF:-}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-}"
      EXTRA_ARGS: "${EXTRA_ARGS:-}"
    entrypoint: ["bash", "-lc"]
    command: ["exec /engine/tools/serve.sh"]
  # CAM editable-memory serve: Qwen3.6-35B-A3B-AWQ + the CAM #100 pointer/retrieve memory plane
  # (namespaces #6, persistence #7, write-gate, freeze/no-clobber, audit/undo). Recall-only on this
  # base: the 4B-trained checkpoint's hidden (2560) != served (2048), so CAM auto-falls-back to
  # pointer/retrieve-only (the residual tap needs a 35B-trained checkpoint). The /cam/* edit plane
  # mounts when MINISGL_CAM=1; transparent read/write ride /v1/*. Validated 5/5 recall + 7/7 hardening
  # surface under graph capture (docs/zaya-port/CAM_35B_TP2_GAP.md). Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name cam -- docker compose --profile cam up -d
  # The 4B pointer checkpoint (MINISGL_CAM_CHECKPOINT_HOST) and the persist dir (MINISGL_CAM_STORE_HOST,
  # survives restart via load-on-boot + debounced autosave) are bind-mounted; override either via env.
  cam:
    <<: *lean-common
    profiles: ["cam"]
    container_name: ${LEASE_NAME:-minisgl-lean}-cam
    # "no", for the same reason as `serve` above — this is the other lease-wrapped GPU service, so
    # it had the identical restart-outlives-the-lease hazard. Fixed here rather than left for the
    # next time it fires.
    restart: "no"
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/ai/hf}:/root/.cache/huggingface
      - ${MINISGL_CAM_CHECKPOINT_HOST:-/home/pat/code/memory-organ-softsteer/cam_ckpt}:/cam_ckpt:ro
      - ${MINISGL_CAM_STORE_HOST:-./.cam_store}:/cam_store
      - ${MINISGL_CAM_GTE_HOST:-/home/pat/code/minisgl-rdna4/.cam_gte}:/cam_gte:ro   # whitened-GTE key artifact (opt-in)
    environment:
      <<: *lean-env
      MINISGL_CAM: "1"
      MINISGL_CAM_CHECKPOINT: /cam_ckpt
      # Sampled (rejection) spec-verify ON by default: lets MTP engage for NON-greedy UNCONSTRAINED
      # requests instead of falling back to plain decode. NOTE: does NOT help grammar-constrained
      # requests (the JSON-schema spine turns) — those still fall back until spec+grammar is wired.
      MINISGL_SPEC_SAMPLED: "${MINISGL_SPEC_SAMPLED:-1}"
      MINISGL_CAM_FRONTEND: "1"                                # route /cam/* to the backend engine.cam
      MINISGL_CAM_AUTO: "${MINISGL_CAM_AUTO:-1}"               # transparent read on /v1/*
      MINISGL_CAM_AUTO_WRITE: "${MINISGL_CAM_AUTO_WRITE:-1}"   # gated ambient write on /v1/* (per-req cam_write wins)
      MINISGL_CAM_WRITE_GATE: "${MINISGL_CAM_WRITE_GATE:-1}"   # base-uncertainty gate (opt-in in frontend mode)
      MINISGL_CAM_STORE_PATH: /cam_store/store.pt              # #7 load-on-boot + debounced autosave
      MINISGL_CAM_MAX_FACTS: "${MINISGL_CAM_MAX_FACTS:-0}"     # 0 = no LRU eviction cap (per-namespace)
      MINISGL_CAM_MAX_NAMESPACES: "${MINISGL_CAM_MAX_NAMESPACES:-0}"  # 0 = unlimited; else cap tenant namespaces (DoS)
      MINISGL_CAM_API_TOKEN: "${MINISGL_CAM_API_TOKEN:-}"      # single admin token (any namespace); blank = open
      MINISGL_CAM_TOKENS: "${MINISGL_CAM_TOKENS:-}"            # multi-tenant: JSON {token: "<ns>"|["<ns>",..]|"*"}
      MINISGL_CAM_REQ_KV_FRAC: "${MINISGL_CAM_REQ_KV_FRAC:-0.70}"  # runaway-generation-kv-guard: force-finish a single req at 70% of the KV pool
      MINISGL_CAM_GTE_KEY: "${MINISGL_CAM_GTE_KEY:-0}"          # 1 = whitened-GTE semantic subject key (paraphrase-robust addressing 0.06->0.43)
      MINISGL_CAM_GTE_WHITEN: /cam_gte/gte_whiten.pkl
      MINISGL_CAM_WRITE_DEDUP_TAU: "${MINISGL_CAM_WRITE_DEDUP_TAU:-}"  # write-side paraphrase dedup cosine; blank => 0.82 under GTE (measured safe), 1.0 (off) on base-embed
      MINISGL_MOE_FUSED_SILU: "${MINISGL_MOE_FUSED_SILU:-1}"   # operator toggle; set 0 if boot fails with "fused gemm1+silu needs the 'wmma' kernel"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-8}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-6}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.80}" \
          --spec-algorithm "${MINISGL_CAM_SPEC:-mtp}" --spec-num-draft "${MINISGL_SPEC_K:-4}" \
          ${MINISGL_EXTRA_ARGS:-}
