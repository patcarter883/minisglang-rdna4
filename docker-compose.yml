# minisgl-rdna4 serving stack — a from-scratch, purpose-built image (Dockerfile), NOT the vllm image.
#
# The image is built for minisglang: ROCm 7.2.1 + torch(gfx1201) + the engine's python deps + the
# custom HIP kernels built from the CANONICAL `rdna4-hip-kernels` repo. No vllm, sglang, flashinfer,
# triton, or sgl_kernel.
#
# The engine SOURCE is hot-mounted at /engine (edit-and-restart), but the kernels come from the image
# (/opt/kernels, canonical) — the repo no longer vendors them.
#
# Usage (GPU work leased through the shared arbiter; --detach binds the lease to the container):
#   # build (CPU only — kernel compiles need no GPU/lease):
#   docker compose build
#   # serve (single card):
#   gpu-lease -n 1 --detach -- docker compose --profile serve up -d
#   docker compose --profile serve logs -f
#   gpu-lease -n 1 --detach -- docker compose --profile serve down

x-lean-common: &lean-common
  image: ${MINISGL_IMAGE:-minisgl-rdna4:lean}
  build:
    context: .
    dockerfile: Dockerfile
    additional_contexts:
      # The canonical kernels live outside this repo's build context — inject them by name.
      kernels: ${RDNA4_HIP_KERNELS:-/home/pat/code/rdna4-hip-kernels}
  restart: "no"
  working_dir: /engine
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add: [video]
  security_opt: [seccomp=unconfined, label=disable]
  cap_add: [SYS_PTRACE]
  ipc: host
  shm_size: "16gb"
  volumes:
    # Engine source (kernels are NOT here anymore — they come from /opt/kernels in the image).
    - .:/engine
    - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
  environment: &lean-env
    # /opt/kernels (canonical HIP kernels, baked into the image) FIRST so nothing under /engine can
    # shadow them; /engine/python = engine; /engine = the 3 not-yet-canonical kernels (w8a8 /
    # moe_bf16 / rxf, still vendored here until ported upstream).
    PYTHONPATH: /opt/kernels:/engine/python:/engine
    HF_HUB_OFFLINE: "0"
    TORCH_BLAS_PREFER_HIPBLASLT: "0"
    # Fragmentation guard: on the 16 GB cards a full-model + graph-capture footprint (e.g. the 35B
    # MXFP4 GDN-hybrid) can leave enough free memory but too little CONTIGUOUS free after capture —
    # a tiny post-capture alloc then OOMs on fragmentation. expandable_segments lets the allocator
    # grow segments instead. Overridable/empty-safe.
    PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
    # The lease injects the leased card set; these MUST stay distinct (physical id vs 0-based
    # re-index) — see CLAUDE.md visible-devices recipe.
    ROCR_VISIBLE_DEVICES: "${LEASE_ROCR_DEVICES:-0}"
    HIP_VISIBLE_DEVICES: "${LEASE_HIP_DEVICES:-0}"
    MINISGL_KV_FP8: "${MINISGL_KV_FP8:-1}"
    # PROTOTYPE (perf/custom-ar-ep): route the in-graph EP MoE all_reduce through the custom_ar one-shot
    # P2P all-reduce instead of RCCL (dp_size==2 + P2P only). Default 0 (RCCL) so this is an opt-in A/B.
    MINISGL_CUSTOM_AR_EP: "${MINISGL_CUSTOM_AR_EP:-0}"
    # Custom one-shot P2P EP all_GATHER (all_gather_p2p, baked into the lean custom_ar). DEFAULT ON —
    # moves the fused EP dispatch gather off RCCL; decoupled from AR, no-ops on non-EP serves, and falls
    # back to RCCL if the baked custom_ar lacks the kernel or P2P is unavailable. Set 0 to force RCCL.
    MINISGL_CUSTOM_AG_EP: "${MINISGL_CUSTOM_AG_EP:-1}"
    # Reasoning + structured output: gate the JSON grammar until </think> (default on). Set 0 to
    # apply the schema from token 0 even with thinking on (the pre-fix behavior / A-B toggle).
    MINISGL_GRAMMAR_THINK_GATE: "${MINISGL_GRAMMAR_THINK_GATE:-1}"
    # DFlash drafter weight-only quant (fp8|int8) — halves the replicated drafter to fit big pairs.
    MINISGL_DFLASH_QUANT: "${MINISGL_DFLASH_QUANT:-}"
    # DDTree: route DFlash through the drafter-agnostic draft-TREE step (per-position top-K marginals
    # -> best-first tree -> ancestor-mask verify) for a higher accept-len than the linear K chain.
    # Forwarded so the scheduler's os.environ read sees it inside the container; topk/budget default
    # in the scheduler when unset.
    MINISGL_DFLASH_DDTREE: "${MINISGL_DFLASH_DDTREE:-}"
    MINISGL_DDTREE_TOPK: "${MINISGL_DDTREE_TOPK:-}"
    MINISGL_DDTREE_BUDGET: "${MINISGL_DDTREE_BUDGET:-}"
    # MTP-head layer count override (config.py knob): forces the Qwen3.5 MTP head on/off through
    # compose. Empty -> trust the checkpoint (default). 0 -> no MTP head (serve the base decoder only).
    MINISGL_MTP_LAYERS: "${MINISGL_MTP_LAYERS:-}"
    # Spec-decode on-device accept+EOS chain (spec/accept_gpu.py): 1 = replace the per-position
    # argmax .cpu() + per-req Python verify/keep loop with the vectorized GPU chain (one batched
    # sync). Byte-lossless; falls back to the host path for constrained/ddtree batches. Default 0.
    MINISGL_SPEC_ONDEVICE: "${MINISGL_SPEC_ONDEVICE:-0}"
    # MoE quant mode: 0 = W4A8 (int4 wt + int8/fp8 act via FP8-WMMA); 1 = W4A16 (weight-only, fp16 act).
    MINISGL_MOE_W4A16: "${MINISGL_MOE_W4A16:-0}"
    # MHA/SWA spec page-aware rollback: =1 keeps page_size=16 under spec (validated coherent +
    # lossless, but A/B showed NO prefill win, so default 0 = shipped page_size->1). CPU proof:
    # tools/spec_page_rollback_check.py.
    MINISGL_SPEC_MHA_PAGED: "${MINISGL_SPEC_MHA_PAGED:-0}"
    # Spec acceptance diagnostics: MINISGL_SPEC_DEBUG=1 logs [spec] accept_rate / emitted-per-step /
    # mean accept-len (every 50 steps + at request end). Default empty (off). Zero serve-path cost.
    MINISGL_SPEC_DEBUG: "${MINISGL_SPEC_DEBUG:-}"
    # TiDAR logit-mixing "Trust-Diffusion" verify (fused-TiDAR path only): verify each draft position
    # against argmax(beta*p_ar + (1-beta)*R_i[0]). 1.0 (default) = the lossless-vs-AR-greedy path
    # (bit-identical); beta<1.0 leans on the diffusion self-draft for higher acceptance but is NOT
    # lossless. Inert for the non-TiDAR profiles here (they don't run the fused path). A tunable knob.
    MINISGL_TIDAR_MIX_BETA: "${MINISGL_TIDAR_MIX_BETA:-1.0}"
    # torch.profiler window (diagnostic): MINISGL_PROFILE=<path under /engine> captures SKIP..SKIP+STEPS
    # forward/verify steps into a chrome trace. Inert unless set. Point at /engine/... so it lands in
    # the mounted worktree; name it *.pt.trace.json.gz so torch gzips it and TraceLens ingests it.
    MINISGL_PROFILE: "${MINISGL_PROFILE:-}"
    MINISGL_PROFILE_SKIP: "${MINISGL_PROFILE_SKIP:-40}"
    MINISGL_PROFILE_STEPS: "${MINISGL_PROFILE_STEPS:-50}"
    # Phase-1 comms/compute overlap: split the fused MoE shared+routed TP all_reduce into 2 disjoint
    # row-chunks and hide chunk-0's collective (side stream, RCCL) behind chunk-1's expert GEMM. Eager
    # prefill only, bit-exact (disjoint rows) — measured +4.3% prefill TTFT @M1. Default ON; =0 to disable.
    MINISGL_MOE_ASYNC_AR: "${MINISGL_MOE_ASYNC_AR:-1}"
    MINISGL_MOE_ASYNC_AR_MIN_TOKENS: "${MINISGL_MOE_ASYNC_AR_MIN_TOKENS:-512}"

services:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # GENERIC RUNNER — the ONE correct way to run ANY test / benchmark / compile / probe / hello-world
  # in a WORKING container: correct image (minisgl-rdna4:lean), correct kernels (/opt/kernels — baked,
  # always consistent with source), ROCm device passthrough, HF cache, and the lease-injected card set.
  # DO NOT hand-roll `docker run` for these — every hand-rolled run has gotten the kernel path wrong
  # (stale live /kernels -> gdn_decode_gated missing, fp8_wmma symlink, etc.). Use THIS.
  #
  #   Self-test (proves image+HIP+kernels all load — run this first when anything looks broken):
  #     gpu-lease -n 1 -- docker compose --profile run run --rm run
  #   Run anything (env MINISGL_CMD is the command; single-quote it):
  #     MINISGL_CMD='python /engine/tools/serve_matrix_bench.py --help' \
  #       gpu-lease -n 1 -- docker compose --profile run run --rm run
  #   Compile a kernel into the canonical repo (CPU only, no lease needed — /kernels is mounted RW):
  #     MINISGL_CMD='cd /kernels/gdn && GPU_ARCHS=gfx1201 bash local/build_local.sh' \
  #       docker compose --profile run run --rm run
  #   TP=2 job: gpu-lease -n 2 -- ...   (the arbiter injects both cards via LEASE_*_DEVICES).
  #
  # Kernels default to the baked /opt/kernels (PYTHONPATH from *lean-env). The canonical repo is ALSO
  # mounted at /kernels for COMPILING or testing local kernel edits — after you build there, set
  # MINISGL_CMD to prepend PYTHONPATH=/kernels/_kernels for that one run.
  run:
    <<: *lean-common
    profiles: ["run"]
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      - ${RDNA4_HIP_KERNELS:-/home/pat/code/rdna4-hip-kernels}:/kernels
    entrypoint: ["bash", "-lc"]
    command:
      - ${MINISGL_CMD:-python /engine/tools/container_selftest.py}

  # vllm 0.24 + full HIP kernels — the PERFORMANT Qwen3.6-35B serve (measured 82.3 tok/s bs=1 decode
  # vs minisglang ~47, no-spec; stock-Triton ceiling 92). Runs the BEST current gdn_hip state by
  # DEFAULT: stride-aware gdn_hip_C.so (indexes the paged mamba cache in place, no fp32 full-cache
  # copy) + paged/cast-free glue + bf16 SSM state (halves recurrent-state HBM). Progression that got
  # here: 24 (baked fp32 full-cache copy) -> 72 (slot-copy) -> 79.6 (stride paged) -> 81.6 (cast-free)
  # -> 81.8 (bf16 ssm) -> 82.3 (fused conv+decode). Remaining 81.8->92 is decode launch/gap structure (~1478 dispatches/token).
  # Run (lease-bound so the janitor never reaps it):
  #     gpu-lease -n 2 --detach --name vhip -- docker compose --profile vhip up -d
  #     docker compose -p lease-vhip logs -f          # watch boot (~2.5 min, no 30-min GDN autotune)
  #     curl localhost:8000/v1/chat/completions ...    # served model name: "x"
  #     docker compose -p lease-vhip down              # stop + release lease
  # Rebuild the stride-aware .so after editing rdna4-hip-kernels/gdn:  bash gdn/local/build_local.sh
  # (inside the image toolchain). To A/B a HIP kernel: set VLLM_PLUGINS (whitelist) /
  # VLLM_ATTENTION_BACKEND (ROCM_HIP_ATTN|TRITON_ATTN); to fall back to the baked (slow fp32-copy) glue
  # set VHIP_GLUE_DST=/tmp/x VHIP_SO_DST=/tmp/y.  Port 8000; probe: tools/msgl_probe.py <pre> <gen> 8000.
  vhip:
    <<: *lean-common
    image: vllm24-hip:combined
    profiles: ["vhip"]
    ports:
      - "8000:8000"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      # DEFAULT ON: paged-aware gdn_hip glue over the baked (slow, fp32-full-cache-copy) one.
      - ${VHIP_GLUE_SRC:-/home/pat/code/minisgl-rdna4/tools/profiling/vllm_oot_slotfix.py}:${VHIP_GLUE_DST:-/usr/local/lib/python3.12/dist-packages/gdn_vllm/vllm_oot.py}:ro
      # DEFAULT ON: rebuilt stride-aware gdn_hip_C.so over the baked contiguous-only one.
      - ${VHIP_SO_SRC:-/home/pat/code/rdna4-hip-kernels/gdn/torch-ext/gdn_hip/gdn_hip_C.cpython-312-x86_64-linux-gnu.so}:${VHIP_SO_DST:-/opt/kernels/gdn_hip/gdn_hip_C.cpython-312-x86_64-linux-gnu.so}:ro
      # DEFAULT ON: bf16 SSM state (conv stays fp32) — halves recurrent-state traffic vs the forced-fp32 baked register.
      - ${VHIP_REG_SRC:-/home/pat/code/minisgl-rdna4/tools/profiling/register_bf16ssm.py}:${VHIP_REG_DST:-/usr/local/lib/python3.12/dist-packages/gdn_vllm/register.py}:ro
      # DEFAULT ON: mla_vllm — the vLLM glue for the baked /opt/kernels/mla_hip kernels. The image
      # ships the kernels AND exports VLLM_MLA_HIP=1 but has no glue, so vLLM picks the CK FMHA for
      # MLA prefill and SEGFAULTS on gfx1201 at GLM-4.7-Flash's 256/256 dims. The dist-info is what
      # makes `mla_hip` resolvable in VLLM_PLUGINS (entry-point group vllm.general_plugins).
      - ${VHIP_MLAGLUE_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/mla_vllm}:/usr/local/lib/python3.12/dist-packages/mla_vllm:ro
      - ${VHIP_MLAMETA_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/mla_vllm-0.1.0.dist-info}:/usr/local/lib/python3.12/dist-packages/mla_vllm-0.1.0.dist-info:ro
      # ...and the rebuilt mla_hip that adds mla_prefill_lse (the baked one has prefill WITHOUT the
      # log-sum-exp output, so it cannot serve vLLM's chunked-context prefill merge).
      - ${VHIP_MLASO_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/mla/torch-ext/mla_hip/mla_hip_C.cpython-312-x86_64-linux-gnu.so}:/opt/kernels/mla_hip/mla_hip_C.cpython-312-x86_64-linux-gnu.so:ro
      - ${VHIP_MLAINIT_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/mla/torch-ext/mla_hip/__init__.py}:/opt/kernels/mla_hip/__init__.py:ro
      # DEFAULT ON: route auto_awq DENSE linears to our W4A8 FP8-WMMA kernel. vLLM only consults
      # _POSSIBLE_KERNELS (where w4a8_vllm installs it) for AWQ on CUDA/CPU — on ROCm it goes
      # straight to the pure-Triton awq_gemm_triton, so our kernel was dead weight for every AWQ
      # model here. (That Triton kernel is also bf16-broken: it accumulates in the output dtype.)
      - ${VHIP_AWQDENSE_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/awqdense_vllm}:/usr/local/lib/python3.12/dist-packages/awqdense_vllm:ro
      - ${VHIP_AWQMETA_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/awqdense_vllm-0.1.0.dist-info}:/usr/local/lib/python3.12/dist-packages/awqdense_vllm-0.1.0.dist-info:ro
      # PERSISTENT TRITON CACHE — not optional here. vLLM's FLA GDN chunk kernels
      # (chunk_scaled_dot_kkt_fwd et al) are Triton-AUTOTUNED per shape, and spec decode at
      # concurrency introduces shapes that warmup never covered. A cold autotune of those takes
      # longer than the executor's RPC timeout, so BOTH ranks sit in do_bench/make_amdgcn and vLLM
      # declares the workers dead ("RPC call to execute_model timed out") — it reads exactly like a
      # TP deadlock but is just an unbounded first-run compile. Persisting the cache pays it once.
      # NOTE its own dir, not vllm-gfx1201/.triton-cache-combined: that one belongs to the vllm22
      # image and this is vllm24 with a different Triton/torch (per vllm-gfx1201 CLAUDE.md §2-3,
      # a changed toolchain wants a fresh cache).
      - ${VHIP_TRITON_CACHE:-/home/pat/code/vllm-gfx1201/.triton-cache-vllm24hip}:/root/.triton
      # ALWAYS-ON startup attention autotune (tcclaviger's, vllm/v1/attention/ops/attn_autotune.py):
      # profiles ~12 configs x every cudagraph capture size x every attention group on EVERY boot and
      # has NO load path upstream — it only dumps. With the GDN path on native HIP (no Triton compile)
      # this is the dominant boot cost. The patched module adds a persistent cache keyed by a hash of
      # upstream's own cache_key, so a hit is byte-identical tuning with none of the wait.
      #   VLLM_ATTN_AUTOTUNE=0 additionally skips it entirely -> built-in defaults (fast, UNTUNED).
      - ${VHIP_ATTNTUNE_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/attn_autotune.py}:/app/vllm/vllm/v1/attention/ops/attn_autotune.py:ro
      - ${VHIP_ATTNTUNE_CACHE:-/home/pat/code/vllm-gfx1201/.attn-autotune-cache-vllm24hip}:/root/.attn_tune
      # Rebuilt fp8_wmma_C.so — adds the BYLANE (N-on-lanes) tiling to the shared gemv_decode core
      # plus the Int4Fp16GemvLoader policy that folds the former standalone W4A16 MoE GEMV onto it.
      # The image's own package was built with the same local shim (namespace fp8_wmma_C, same .so
      # basename), so this drops straight in. Both package names are the SAME .so in the image —
      # mount both so they can never skew. Rebuild: MINISGL_IMAGE=vllm24-hip:combined
      # MINISGL_CMD='cd /kernels/fp8_wmma && GPU_ARCHS=gfx1201 bash local/build_local.sh'
      # gpu-lease -n 1 -- docker compose --profile run run --rm run
      - ${VHIP_FP8SO_SRC:-/home/pat/code/rdna4-hip-kernels/fp8_wmma/torch-ext/fp8_wmma/fp8_wmma_C.cpython-312-x86_64-linux-gnu.so}:/opt/kernels/w4a8_fp8_wmma/fp8_wmma_C.cpython-312-x86_64-linux-gnu.so:ro
      - ${VHIP_FP8SO_SRC:-/home/pat/code/rdna4-hip-kernels/fp8_wmma/torch-ext/fp8_wmma/fp8_wmma_C.cpython-312-x86_64-linux-gnu.so}:/opt/kernels/fp8_wmma/fp8_wmma_C.cpython-312-x86_64-linux-gnu.so:ro
      # ...and the matching package __init__.py (strict superset of the image's: adds only the
      # mmq_regdirect_w4a16_moe_gemv_silu wrapper for the new fused-SiLU op).
      - ${VHIP_FP8INIT_SRC:-/home/pat/code/rdna4-hip-kernels/fp8_wmma/torch-ext/fp8_wmma/__init__.py}:/opt/kernels/w4a8_fp8_wmma/__init__.py:ro
      # W4A16 grouped MoE. MEASURED (tools/profiling, cudagraph decode trace): the stock Triton
      # `fused_moe_kernel_gptq_awq` is the #1 decode kernel at 26% of GPU time — our fp8-activation
      # grouped kernel never engaged there, because the crossover cache's decode window is empty.
      # This patched hook routes M<=96 to `mmq_regdirect_w4a16_moe_gemv`, which reads the SAME
      # standard (E,N,K/8) weights (no repack, no extra VRAM) and skips activation quantisation
      # entirely: rel error vs an fp16 dequant reference 0.0006 vs the fp8 path's 0.045
      # (tools/vhip_patches/test_w4a16_moe.py, 4/4 on the real Qwen expert shape).
      - ${VHIP_MOEEXP_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/moe_experts.py}:/usr/local/lib/python3.12/dist-packages/w4a8_vllm/moe_experts.py:ro
      # rdna4_vllm: the consolidated native-HIP wiring plugin (LM head today; see
      # docs/RDNA4_VLLM_WIRING_SPEC.md). Registered as a real vllm.general_plugins entry point.
      - ${VHIP_RDNA4_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/rdna4_vllm}:/usr/local/lib/python3.12/dist-packages/rdna4_vllm:ro
      - ${VHIP_RDNA4META_SRC:-/home/pat/code/minisgl-rdna4/tools/vhip_patches/rdna4_vllm-0.1.0.dist-info}:/usr/local/lib/python3.12/dist-packages/rdna4_vllm-0.1.0.dist-info:ro
      # dense_gemm is NOT in the base image; the LM-head M>16 branch needs it (no-fallback policy
      # means that path must be a real kernel, not a raise). Built via dense_gemm/local/build_local.sh.
      - ${VHIP_DENSEGEMM_SRC:-/home/pat/code/rdna4-hip-kernels/dense_gemm/torch-ext/dense_gemm}:/opt/kernels/dense_gemm:ro
      # torch.compile / inductor AOT cache. vLLM writes it to /root/.cache/vllm and logs "saved AOT
      # compiled function to ..." — but with the dir unmounted that is thrown away on container exit,
      # so every boot recompiles the backbone (~28 s) + eagle head (~6 s). Persisting it is the second
      # biggest boot win after the attention-autotune cache. Keyed by model+config hash, so each
      # distinct matrix row compiles once and is free thereafter.
      - ${VHIP_VLLM_CACHE:-/home/pat/code/vllm-gfx1201/.vllm-compile-cache-vllm24hip}:/root/.cache/vllm
    # bash-array command so an optional --speculative-config JSON (VHIP_SPEC) can be appended without
    # bash brace-expanding/word-splitting its {"...":...} — the `$$` are passed through by compose and
    # evaluated in-container at runtime. VHIP_SPEC presets (spec-decode; needs memory headroom — drop
    # --max-model-len / --gpu-memory-utilization if it OOMs on KV):
    #   MTP    (native, Qwen3.6 MTP head):  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}'
    #          — VALIDATED loads+serves, but MEASURED NET-NEGATIVE at bs=1 (~28 tok/s vs 82 plain:
    #            propose ~5x, accept ~1.9). May pay off at higher concurrency / a better drafter.
    #   DFlash (drafter must be vLLM/EAGLE3-loadable; the ZAYA/minisgl DFlash drafters are NOT — they
    #           are minisgl-native, so DFlash here needs an EAGLE3-format Qwen drafter checkpoint):
    #            VHIP_SPEC='{"method":"eagle3","model":"<eagle3-drafter-path>","num_speculative_tokens":3}'
    #   draft-model form (any vLLM-loadable small model):  VHIP_SPEC='{"model":"<drafter>","num_speculative_tokens":3}'
    # e.g.  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}' gpu-lease -n 2 --detach --name vhip -- docker compose --profile vhip up -d
    entrypoint: ["bash", "-lc"]
    command:
      - |
        # Escape hatch: run an arbitrary command with THIS service's mounts+env instead of the
        # server. A profile has to see the same glue/.so/plugin overlays the serve sees, and the
        # `run` profile above carries none of them — duplicating this mount list into a second
        # service is exactly how the two would drift apart. One-shot use (foreground):
        #   VHIP_CMD='export VLLM_TORCH_PROFILER_DIR=/engine/tools/profiling/prof_out PROF_MODEL=x;
        #             python3 /engine/tools/profiling/offline_profile.py' \
        #   gpu-lease -n 2 --name vhipprof -- docker compose --profile vhip run --rm vhip
        if [ -n "$${VHIP_CMD:-}" ]; then echo "[vhip] VHIP_CMD override"; eval "$${VHIP_CMD}"; exit $$?; fi
        args=("$${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
          --host 0.0.0.0 --port 8000 --tensor-parallel-size "$${VHIP_TP:-2}"
          --max-model-len "$${VHIP_MAXLEN:-60000}"
          --kv-cache-dtype "$${VHIP_KV:-fp8}" --dtype "$${VHIP_DTYPE:-float16}"
          --max-num-batched-tokens "$${VHIP_MBT:-2048}" --max-num-seqs "$${VHIP_MNS:-8}"
          --gpu-memory-utilization "$${VHIP_MEM:-0.92}"
          --language-model-only
          --served-model-name x --trust-remote-code)
        if [ -n "$${VHIP_SPEC:-}" ]; then args+=(--speculative-config "$${VHIP_SPEC}"); fi
        # free-form escape hatch, word-split on purpose (e.g. VHIP_EXTRA='--enforce-eager --seed 0')
        if [ -n "$${VHIP_EXTRA:-}" ]; then args+=($${VHIP_EXTRA}); fi
        # Prefix caching: default ON (VHIP_PREFIX_CACHE=1) — a serve that re-prefills every turn is
        # mostly useless. vLLM auto-disables it for a HYBRID GDN model, so we force it on, which puts
        # the mamba cache in experimental 'align' mode (attn block padded up to the GDN page + a full
        # conv+ssm GDN state snapshot reserved PER KV block). MoE 35B fits at VHIP_MNS<=4. On a DENSE-GDN
        # model (Qwen 27B) that per-block state ~doubles the footprint and can overcommit the 16GB card
        # ("No available memory for the cache blocks") — trim VHIP_MNS / VHIP_MAXLEN, or VHIP_PREFIX_CACHE=0.
        pc="$${VHIP_PREFIX_CACHE}"; [ "$$pc" = 1 ] && args+=(--enable-prefix-caching)
        # reasoning parser (<think> -> reasoning_content), tool-call parser + auto tool-choice, and the
        # checkpoint's preserve_thinking chat-template kwarg. Defaults live in the environment block below
        # (a bash ${VAR:-default} silently drops here). Set any of these env vars to "off" to skip.
        rp="$${VHIP_REASONING_PARSER}"; [ "$$rp" != off ] && [ -n "$$rp" ] && args+=(--reasoning-parser "$$rp")
        tp="$${VHIP_TOOL_PARSER}"
        if [ "$$tp" != off ] && [ -n "$$tp" ]; then
          args+=(--tool-call-parser "$$tp")
          [ "$${VHIP_TOOL_CHOICE}" = 1 ] && args+=(--enable-auto-tool-choice)
        fi
        ctk="$${VHIP_CHAT_TEMPLATE_KWARGS}"; [ "$$ctk" != off ] && [ -n "$$ctk" ] && args+=(--default-chat-template-kwargs "$$ctk")
        echo "[vhip] spec=$${VHIP_SPEC:-none} reasoning=$${rp:-off} tools=$${tp:-off} auto-tool-choice=$${VHIP_TOOL_CHOICE} ctk=$${ctk:-off}"
        exec /app/tools/image_entrypoint.sh "$${args[@]}"
    environment:
      <<: *lean-env
      PYTHONPATH: /opt/kernels
      # MEASURED 2026-07-29 (spec decode trace, tools/profiling/prof_spec): RCCL all-reduce is 33%
      # of spec-decode GPU time — 93 calls/step (2 per layer x 48 layers) at 92.8 us for a ~12 KB
      # message. The no-spec profile has the same call count at 42 us for 1/3 the bytes, i.e. cost
      # scales with SIZE on a message far too small to be bandwidth-bound — the signature of a
      # host-staged path. With P2P off, RCCL cannot use the PCIe peer link between the two cards.
      # Spec pays this 3x harder than plain decode (verify carries qlen=3), so it is a prime suspect
      # for the spec gap vs stock.
      # DO NOT set NCCL_P2P_DISABLE=0: MEASURED 2026-07-29, RCCL cannot bring up its P2P transport
      # between these two RDNA4 cards — ncclCommInitRank dies on BOTH ranks with
      # "NCCL error: unhandled cuda error" / "[FATAL ERROR]: HIP failure: 'invalid argument'".
      # The =1 here is load-bearing, not a copied default. (HIP IPC peer access itself DOES work on
      # this box — minisgl's custom_ar one-shot allreduce uses it — so the fix is a custom AR, not
      # RCCL P2P. vLLM skips its _can_p2p probe on ROCm, so custom AR is gated by arch, not peer.)
      NCCL_P2P_DISABLE: "${NCCL_P2P_DISABLE:-1}"
      # Simple protocol + Ring algorithm: with P2P off every collective stages through host memory,
      # where Ring's contiguous chunked transfers beat Tree's latency-optimised pattern, and Simple
      # avoids LL/LL128's protocol overhead on a path that is already copy-bound.
      NCCL_PROTO: "${NCCL_PROTO:-Simple}"
      NCCL_ALGO: "${NCCL_ALGO:-Ring}"
      # `awq_dense_hip` MUST be here, not just in the glm/laguna presets. w4a8_fp8_wmma_register
      # installs our W4A8 kernel at _POSSIBLE_KERNELS[ROCM][0], but for an AWQ checkpoint that
      # registry is NEVER consulted on ROCm (AutoAWQConfig.get_quant_method routes to the
      # choose_mp_linear_kernel path only on CUDA/CPU; on ROCm it returns AutoAWQLinearMethod ->
      # vLLM's pure-Triton awq_gemm). Without awq_dense_hip our dense kernel is dead weight and every
      # AWQ dense linear runs stock Triton — which is what Qwen3.6-35B-A3B-AWQ was silently doing.
      # NOTE the `-` not `:-`: an EXPLICIT empty VLLM_PLUGINS must mean "load no plugins" (the
      # all-stock A/B row). With `:-` compose substitutes the default on empty as well as unset, so
      # `VLLM_PLUGINS=""` silently booted the full HIP stack and an all-stock row measured identical
      # to the HIP baseline — a fake null result. Only UNSET now falls back to the default.
      VLLM_PLUGINS: "${VLLM_PLUGINS-gdn_hip,tail_hip_register,w4a8_fp8_wmma_register,awq_dense_hip,rdna4_hip}"
      VLLM_ATTENTION_BACKEND: "${VLLM_ATTENTION_BACKEND:-}"
      # W4A8 dispatch gates. FORCE=on keeps MoE experts on our grouped FP8-WMMA kernel for every
      # batch; "auto" (default) consults the tuned crossover cache and falls back to stock Triton
      # fused_moe outside the proven-winning M window. AWQ_DENSE=0 disables the dense routing plugin.
      VLLM_ROCM_W4A8_FORCE: "${VLLM_ROCM_W4A8_FORCE:-auto}"
      VLLM_ROCM_W4A8_AWQ_DENSE: "${VLLM_ROCM_W4A8_AWQ_DENSE:-1}"
      # W4A16 decode MoE (see the moe_experts.py mount above): auto|on|off. DEFAULT AUTO —
      # MEASURED 90.7 vs 83.0 tok/s bs=1 decode (+9.3%) AND ~70x more accurate than the fp8-act path
      # (rel err 0.0006 vs 0.045). Needed BOTH the BYLANE tiling for gemm2 (K=256 starved the
      # K-on-lanes wave) and fused SiLU/scatter epilogues; either alone measures as a regression or
      # a wash. "auto" engages only on an fp16 serve (the GEMV takes at::Half pointers, so bf16 —
      # GLM, Laguna — would need a per-step cast, exactly the hidden hot-path copy this forbids);
      # "on" engages regardless and raises on bf16. The decision is printed once at the first
      # expert batch either way, so it can never go inert unnoticed.
      VLLM_ROCM_W4A16_MOE: "${VLLM_ROCM_W4A16_MOE:-auto}"
      VLLM_ROCM_W4A16_MOE_MAX_M: "${VLLM_ROCM_W4A16_MOE_MAX_M:-96}"
      # First-batch MoE crossover autotune. It runs a synchronous A/B on the FIRST batch that hits
      # an untuned expert shape — on TP>1 that is a long one-rank stall mid-step, which desyncs the
      # ranks and kills the engine with "RPC call to sample_tokens timed out". Off by default here.
      VLLM_ROCM_W4A8_AUTOTUNE: "${VLLM_ROCM_W4A8_AUTOTUNE:-off}"
      # GDN spec-decode path selection (see tools/profiling/vllm_oot_slotfix.py).
      VLLM_GDN_HIP_SPEC: "${VLLM_GDN_HIP_SPEC:-0}"
      VLLM_GDN_HIP_SPEC_DEBUG: "${VLLM_GDN_HIP_SPEC_DEBUG:-0}"
      VLLM_GDN_HIP_SPEC_NO_SCATTER: "${VLLM_GDN_HIP_SPEC_NO_SCATTER:-0}"
      VLLM_GDN_HIP_SPEC_AB: "${VLLM_GDN_HIP_SPEC_AB:-0}"
      VLLM_GDN_HIP_SPEC_GATHER: "${VLLM_GDN_HIP_SPEC_GATHER:-0}"
      VLLM_GDN_HIP_SPEC_FUSED: "${VLLM_GDN_HIP_SPEC_FUSED:-1}"
      # Startup attention-autotune control (see the mounts above).
      VLLM_ATTN_AUTOTUNE_CACHE_DIR: "${VLLM_ATTN_AUTOTUNE_CACHE_DIR:-/root/.attn_tune}"
      VLLM_ATTN_AUTOTUNE: "${VLLM_ATTN_AUTOTUNE:-1}"
      # Give a COLD Triton autotune room to finish. vLLM's default (300 s) is shorter than a
      # first-time GDN chunk-kernel tune on a fresh shape, and blowing it kills the engine outright
      # rather than just being slow. With the Triton cache mounted above this only bites on the
      # first run after an image/kernel change.
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}"
      # MLA models (GLM-4.7-Flash) — vLLM's ROCm MLA *prefill* selector only offers CK-based
      # FlashAttention (ROCM_AITER_FA -> FLASH_ATTN, both `flash_attn.mha_varlen_fwd`), and that CK
      # FMHA kernel SEGFAULTS on gfx1201 at qk=256/v=256. Two ways out, in preference order:
      #   MLA_HIP=1                            -> our native mla_hip prefill backend (see mla_vllm glue)
      #   FLASH_ATTENTION_TRITON_AMD_ENABLE    -> flash_attn's Triton-AMD path instead of CK.
      # NOTE the value must be the literal string "TRUE" — flash_attn does `== "TRUE"`, so "1" is a
      # SILENT no-op (the `vllm` service below had exactly that bug).
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "${FLASH_ATTENTION_TRITON_AMD_ENABLE:-FALSE}"
      # spec-decode + serve tunables (empty -> in-container defaults above). Set VHIP_SPEC to a
      # --speculative-config JSON (see presets above) to enable MTP / DFlash / draft-model spec.
      MINISGL_MODEL: "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
      # non-empty -> run this instead of the server (see the command block above); used to
      # profile with the serve's exact mounts/env.
      VHIP_CMD: "${VHIP_CMD:-}"
      VHIP_SPEC: "${VHIP_SPEC:-}"
      VHIP_MAXLEN: "${VHIP_MAXLEN:-}"
      VHIP_MNS: "${VHIP_MNS:-}"
      VHIP_MEM: "${VHIP_MEM:-}"
      # per-model knobs (empty -> the in-container defaults in the command block above).
      # VHIP_KV=auto is REQUIRED for MLA models (GLM-4.7-Flash): the triton_mla backend rejects fp8 KV.
      VHIP_TP: "${VHIP_TP:-}"
      VHIP_KV: "${VHIP_KV:-}"
      VHIP_DTYPE: "${VHIP_DTYPE:-}"
      VHIP_MBT: "${VHIP_MBT:-}"
      VHIP_EXTRA: "${VHIP_EXTRA:-}"
      # prefix caching default ON (a serve without it re-prefills every turn). For a hybrid GDN model
      # this uses experimental mamba 'align' mode; if it overcommits (dense GDN, long ctx), lower
      # VHIP_MNS / VHIP_MAXLEN, or set VHIP_PREFIX_CACHE=0 to disable.
      VHIP_PREFIX_CACHE: "${VHIP_PREFIX_CACHE:-1}"
      # reasoning/tool parsing — Qwen3.6 defaults; set to "off" to skip either,
      # VHIP_TOOL_CHOICE=0 to drop --enable-auto-tool-choice.
      VHIP_REASONING_PARSER: "${VHIP_REASONING_PARSER:-qwen3}"
      VHIP_TOOL_PARSER: "${VHIP_TOOL_PARSER:-qwen3_coder}"
      VHIP_TOOL_CHOICE: "${VHIP_TOOL_CHOICE:-1}"
      # server-wide chat-template kwargs (JSON) — preserve_thinking keeps prior-turn <think> blocks in
      # the rendered context (the checkpoint template's kwarg). Set "off" to omit.
      VHIP_CHAT_TEMPLATE_KWARGS: '${VHIP_CHAT_TEMPLATE_KWARGS:-{"preserve_thinking": true}}'

  # STOCK BASELINE — the collaborator's unmodified vLLM 0.24 image (`tcclaviger/vllm:latest`,
  # vllm 0.24.0), which is exactly the base `vllm24-hip:combined` is built FROM. Deliberately
  # carries NONE of the vhip overlays: no gdn_hip glue, no mla_hip, no rocm_hip_attn, no W4A8/W4A16
  # MoE, no rdna4_vllm LM head, no patched attn_autotune. This is the reference the wiring table's
  # "stock vLLM" row must come from — same serve flags as `vhip` so the only variable is the stack.
  #
  #   VSTOCK_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}' \
  #     gpu-lease -n 2 --detach --name vstock -- docker compose --profile vstock up -d
  #
  # Boot is LONG the first time: stock GDN runs vLLM's vendored fla Triton kernels, whose cold
  # compile is tens of minutes, plus tcclaviger's always-on startup attention autotune (unpatched
  # here, so no persistent cache — it re-profiles every boot). The Triton cache mount makes the
  # GDN half one-time. Do not mistake either for a hang.
  vstock:
    <<: *lean-common
    image: ${VSTOCK_IMAGE:-tcclaviger/vllm:latest}
    profiles: ["vstock"]
    # lean-common's /engine working dir does not exist in the stock image (nothing is mounted there).
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      # Same Triton cache dir as vhip — same image lineage/toolchain, so entries are valid here.
      - ${VHIP_TRITON_CACHE:-/home/pat/code/vllm-gfx1201/.triton-cache-vllm24hip}:/root/.triton
      # torch.compile / inductor AOT cache (keyed by model+config hash, so stock gets its own rows).
      - ${VSTOCK_VLLM_CACHE:-/home/pat/code/vllm-gfx1201/.vllm-compile-cache-vstock}:/root/.cache/vllm
    entrypoint: ["bash", "-lc"]
    command:
      - |
        args=("$${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
          --host 0.0.0.0 --port 8000 --tensor-parallel-size 2
          --max-model-len "$${VHIP_MAXLEN:-32768}" --kv-cache-dtype fp8 --dtype float16
          --max-num-batched-tokens "$${VSTOCK_MBT:-2048}" --max-num-seqs "$${VHIP_MNS:-8}"
          --gpu-memory-utilization "$${VHIP_MEM:-0.92}"
          --language-model-only
          --served-model-name x --trust-remote-code)
        if [ -n "$${VSTOCK_SPEC:-}" ]; then args+=(--speculative-config "$${VSTOCK_SPEC}"); fi
        pc="$${VHIP_PREFIX_CACHE}"; [ "$$pc" = 1 ] && args+=(--enable-prefix-caching)
        rp="$${VHIP_REASONING_PARSER}"; [ "$$rp" != off ] && [ -n "$$rp" ] && args+=(--reasoning-parser "$$rp")
        tp="$${VHIP_TOOL_PARSER}"
        if [ "$$tp" != off ] && [ -n "$$tp" ]; then
          args+=(--tool-call-parser "$$tp")
          [ "$${VHIP_TOOL_CHOICE}" = 1 ] && args+=(--enable-auto-tool-choice)
        fi
        ctk="$${VHIP_CHAT_TEMPLATE_KWARGS}"; [ "$$ctk" != off ] && [ -n "$$ctk" ] && args+=(--default-chat-template-kwargs "$$ctk")
        echo "[vstock] STOCK vllm24 — spec=$${VSTOCK_SPEC:-none} plugins=<none>"
        exec /app/tools/image_entrypoint.sh "$${args[@]}"
    environment:
      <<: *lean-env
      # NOT /opt/kernels — the stock image has no canonical-kernel tree, and pointing PYTHONPATH at
      # a non-existent dir is the kind of thing that silently half-loads something later.
      PYTHONPATH: ""
      # Belt-and-braces: even if some plugin dist-info leaked in, load none of it.
      VLLM_PLUGINS: ""
      NCCL_P2P_DISABLE: "1"
      NCCL_PROTO: Simple
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "1"
      VLLM_ATTENTION_BACKEND: "${VLLM_ATTENTION_BACKEND:-}"
      MINISGL_MODEL: "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
      VSTOCK_SPEC: "${VSTOCK_SPEC:-}"
      # Prefill chunk. MEASURED: at 2048 the profiling run's activation peak through stock Triton's
      # 256-expert `fused_moe_kernel_gptq_awq` leaves NEGATIVE KV headroom on a 16 GiB card once the
      # 11.35 GiB of TP=2 weights are down — max-num-seqs and max-model-len barely move it, this does.
      # Irrelevant to a bs=1 decode measurement (it only chunks long prefills).
      VSTOCK_MBT: "${VSTOCK_MBT:-2048}"
      VHIP_MAXLEN: "${VHIP_MAXLEN:-}"
      VHIP_MNS: "${VHIP_MNS:-}"
      VHIP_MEM: "${VHIP_MEM:-}"
      VHIP_PREFIX_CACHE: "${VHIP_PREFIX_CACHE:-1}"
      VHIP_REASONING_PARSER: "${VHIP_REASONING_PARSER:-qwen3}"
      VHIP_TOOL_PARSER: "${VHIP_TOOL_PARSER:-qwen3_coder}"
      VHIP_TOOL_CHOICE: "${VHIP_TOOL_CHOICE:-1}"
      VHIP_CHAT_TEMPLATE_KWARGS: '${VHIP_CHAT_TEMPLATE_KWARGS:-{"preserve_thinking": true}}'

  vllm:
    <<: *lean-common
    image: tcclaviger/vllm:latest
    profiles: ["vllm"]
    ports:
      - "8000:8000"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
    # bash-array command so an optional --speculative-config JSON (VHIP_SPEC) can be appended without
    # bash brace-expanding/word-splitting its {"...":...} — the `$$` are passed through by compose and
    # evaluated in-container at runtime. VHIP_SPEC presets (spec-decode; needs memory headroom — drop
    # --max-model-len / --gpu-memory-utilization if it OOMs on KV):
    #   MTP    (native, Qwen3.6 MTP head):  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}'
    #          — VALIDATED loads+serves, but MEASURED NET-NEGATIVE at bs=1 (~28 tok/s vs 82 plain:
    #            propose ~5x, accept ~1.9). May pay off at higher concurrency / a better drafter.
    #   DFlash (drafter must be vLLM/EAGLE3-loadable; the ZAYA/minisgl DFlash drafters are NOT — they
    #           are minisgl-native, so DFlash here needs an EAGLE3-format Qwen drafter checkpoint):
    #            VHIP_SPEC='{"method":"eagle3","model":"<eagle3-drafter-path>","num_speculative_tokens":3}'
    #   draft-model form (any vLLM-loadable small model):  VHIP_SPEC='{"model":"<drafter>","num_speculative_tokens":3}'
    # e.g.  VHIP_SPEC='{"method":"qwen3_next_mtp","num_speculative_tokens":2}' gpu-lease -n 2 --detach --name vllm -- docker compose --profile vllm up -d
    entrypoint: ["bash", "-lc"]
    command:
      - |
        args=("$${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
          --host 0.0.0.0 --port 8000 --tensor-parallel-size "$${VHIP_TP:-2}"
          --max-model-len "$${VHIP_MAXLEN:-60000}"
          --kv-cache-dtype "$${VHIP_KV:-fp8}" --dtype "$${VHIP_DTYPE:-float16}"
          --max-num-batched-tokens "$${VHIP_MBT:-2048}" --max-num-seqs "$${VHIP_MNS:-8}"
          --gpu-memory-utilization "$${VHIP_MEM:-0.92}"
          --language-model-only
          --served-model-name x --trust-remote-code)
        if [ -n "$${VHIP_SPEC:-}" ]; then args+=(--speculative-config "$${VHIP_SPEC}"); fi
        # free-form escape hatch, word-split on purpose (e.g. VHIP_EXTRA='--enforce-eager --seed 0')
        if [ -n "$${VHIP_EXTRA:-}" ]; then args+=($${VHIP_EXTRA}); fi
        # Prefix caching: default ON (VHIP_PREFIX_CACHE=1) — a serve that re-prefills every turn is
        # mostly useless. vLLM auto-disables it for a HYBRID GDN model, so we force it on, which puts
        # the mamba cache in experimental 'align' mode (attn block padded up to the GDN page + a full
        # conv+ssm GDN state snapshot reserved PER KV block). MoE 35B fits at VHIP_MNS<=4. On a DENSE-GDN
        # model (Qwen 27B) that per-block state ~doubles the footprint and can overcommit the 16GB card
        # ("No available memory for the cache blocks") — trim VHIP_MNS / VHIP_MAXLEN, or VHIP_PREFIX_CACHE=0.
        pc="$${VHIP_PREFIX_CACHE}"; [ "$$pc" = 1 ] && args+=(--enable-prefix-caching)
        # reasoning parser (<think> -> reasoning_content), tool-call parser + auto tool-choice, and the
        # checkpoint's preserve_thinking chat-template kwarg. Defaults live in the environment block below
        # (a bash ${VAR:-default} silently drops here). Set any of these env vars to "off" to skip.
        rp="$${VHIP_REASONING_PARSER}"; [ "$$rp" != off ] && [ -n "$$rp" ] && args+=(--reasoning-parser "$$rp")
        tp="$${VHIP_TOOL_PARSER}"
        if [ "$$tp" != off ] && [ -n "$$tp" ]; then
          args+=(--tool-call-parser "$$tp")
          [ "$${VHIP_TOOL_CHOICE}" = 1 ] && args+=(--enable-auto-tool-choice)
        fi
        ctk="$${VHIP_CHAT_TEMPLATE_KWARGS}"; [ "$$ctk" != off ] && [ -n "$$ctk" ] && args+=(--default-chat-template-kwargs "$$ctk")
        echo "[vhip] spec=$${VHIP_SPEC:-none} reasoning=$${rp:-off} tools=$${tp:-off} auto-tool-choice=$${VHIP_TOOL_CHOICE} ctk=$${ctk:-off}"
        exec /app/tools/image_entrypoint.sh "$${args[@]}"
    environment:
      <<: *lean-env
      PYTHONPATH: /opt/kernels
      NCCL_P2P_DISABLE: "1"
      NCCL_PROTO: Simple
      VLLM_ATTENTION_BACKEND: "${VLLM_ATTENTION_BACKEND:-}"
      # flash_attn compares this to the literal string "TRUE" (`== "TRUE"`), so the old "1" here was a
      # SILENT no-op — it never switched CK for the Triton-AMD path.
      FLASH_ATTENTION_TRITON_AMD_ENABLE: "${FLASH_ATTENTION_TRITON_AMD_ENABLE:-TRUE}"
      # spec-decode + serve tunables (empty -> in-container defaults above). Set VHIP_SPEC to a
      # --speculative-config JSON (see presets above) to enable MTP / DFlash / draft-model spec.
      MINISGL_MODEL: "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}"
      VHIP_SPEC: "${VHIP_SPEC:-}"
      VHIP_MAXLEN: "${VHIP_MAXLEN:-}"
      VHIP_MNS: "${VHIP_MNS:-}"
      VHIP_MEM: "${VHIP_MEM:-}"
      # per-model knobs (empty -> the in-container defaults in the command block above).
      # VHIP_KV=auto is REQUIRED for MLA models (GLM-4.7-Flash): the triton_mla backend rejects fp8 KV.
      VHIP_TP: "${VHIP_TP:-}"
      VHIP_KV: "${VHIP_KV:-}"
      VHIP_DTYPE: "${VHIP_DTYPE:-}"
      VHIP_MBT: "${VHIP_MBT:-}"
      VHIP_EXTRA: "${VHIP_EXTRA:-}"
      # prefix caching default ON (a serve without it re-prefills every turn). For a hybrid GDN model
      # this uses experimental mamba 'align' mode; if it overcommits (dense GDN, long ctx), lower
      # VHIP_MNS / VHIP_MAXLEN, or set VHIP_PREFIX_CACHE=0 to disable.
      VHIP_PREFIX_CACHE: "${VHIP_PREFIX_CACHE:-1}"
      # reasoning/tool parsing — Qwen3.6 defaults; set to "off" to skip either,
      # VHIP_TOOL_CHOICE=0 to drop --enable-auto-tool-choice.
      VHIP_REASONING_PARSER: "${VHIP_REASONING_PARSER:-qwen3}"
      VHIP_TOOL_PARSER: "${VHIP_TOOL_PARSER:-qwen3_coder}"
      VHIP_TOOL_CHOICE: "${VHIP_TOOL_CHOICE:-1}"
      # server-wide chat-template kwargs (JSON) — preserve_thinking keeps prior-turn <think> blocks in
      # the rendered context (the checkpoint template's kwarg). Set "off" to omit.
      VHIP_CHAT_TEMPLATE_KWARGS: '${VHIP_CHAT_TEMPLATE_KWARGS:-{"preserve_thinking": true}}'

  # Default: Qwen3.6-35B-A3B-AWQ (W4A8 MoE) on the native-HIP Triton-free path, radix prefix cache.
  # GRAPH-CAPTURED decode (cuda-graph-max-bs 8, max-running 8): eager MoE decode leaves ~45% of device
  # time in host-launched gather/scatter/topk glue that serializes with the custom_ar all-reduce spins,
  # so eager conc-4 pulls only ~70 tok/s / ~120W while the graph-captured path hits ~100 tok/s / ~250-284W
  # at 100% util (measured 2026-07-16, 35B AWQ TP=2). max-running==cuda-graph-max-bs so EVERY admissible
  # decode batch (buckets [1,2,4,8]) is captured — none falls back to eager — and 8 covers the real-trace
  # concurrency peak (~7). Was cuda-graph-max-bs=0 (uniformly eager) — that was the latent 120W config.
  serve:
    <<: *lean-common
    profiles: ["serve"]
    container_name: ${LEASE_NAME:-minisgl-lean}-serve
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-auto}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-8}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-8}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.8}" \
          ${MINISGL_EXTRA_ARGS:-}

  # Qwen3.6-35B-A3B-AWQ (W4A16 compressed-tensors MoE, GDN-hybrid) at TP=2 with MTP spec-decode UNDER
  # CUDA graph capture. Graph capture is REQUIRED — spec run eager is not the served config and its
  # numbers are not a result (graph-capture-required rule); that is why cuda-graph-max-bs defaults to
  # 16 here, not 0. The MTP head is itself MoE. Draft length MINISGL_SPEC_K defaults to the sweep-
  # optimal K=4 (graph-captured sweep: baseline 47.7 -> 64.7 tok/s at K=4, +36%; falls off past 5).
  # Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name qwen -- docker compose --profile qwen up -d
  qwen:
    <<: *lean-common
    profiles: ["qwen"]
    container_name: ${LEASE_NAME:-minisgl-lean}-qwen
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-auto}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm mtp --spec-num-draft "${MINISGL_SPEC_K:-4}" \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-16}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-32}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.82}" \
          ${MINISGL_EXTRA_ARGS:-}

  # GLM-4.7-Flash-AWQ (W4A8 AWQ MoE + MLA) at TP=2 with MTP spec-decode UNDER CUDA graph capture
  # (num_nextn_predict_layers=1). Same graph-capture requirement as `qwen`. Draft length
  # MINISGL_SPEC_K defaults to the sweep-optimal K=2 (:lean sweep 2026-07-22, TP=2 M=1 decode: no-spec
  # 48.5 -> K=1 64.9 -> K=2 70.9 -> K=3 64.8 tok/s; peak K=2 = +46%, accept-len ~1.9). Old "GLM MTP is
  # a net loss / K=1 best" is FALSIFIED on the optimized image; K=2 now beats K=1. (EAGLE3 is unusable
  # here — the cached thoughtworks/GLM-4.7-Flash-Eagle3 draft is 2048-hidden vs this ckpt's 6144.)
  # Needs TP=2.
  #   gpu-lease -n 2 --detach --name glm -- docker compose --profile glm up -d
  glm:
    <<: *lean-common
    profiles: ["glm"]
    container_name: ${LEASE_NAME:-minisgl-lean}-glm
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-QuantTrio/GLM-4.7-Flash-AWQ}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-auto}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm mtp --spec-num-draft "${MINISGL_SPEC_K:-2}" \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-16}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-32}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.82}" \
          ${MINISGL_EXTRA_ARGS:-}

  # Qwen3.6-35B-A3B-MXFP4 (GDN-hybrid + 128-expert MoE; MXFP4 weights, bf16-native, MTP head left
  # UNQUANTIZED) at TP=2 with MTP spec-decode UNDER CUDA graph capture. This is the prod spec config —
  # MTP K=2 gives the best single-stream tok/s on this GDN+MoE target (:lean sweep 2026-07-22, TP=2 M=1
  # decode: no-spec 53.2 -> K=1 68.0 -> K=2 76.6 -> K=4 71.8 tok/s; peak K=2 = +44%, accept-len ~2.4).
  # Supersedes the older "K=4" note — the optimized image's peak moved down to K=2 (K=4's higher
  # accept-len is outweighed by the qlen=5 verify cost). DFlash K=15 is a wider-verify tax — use the
  # qwen35b-dflash profile for that. MTP is uniform-K so it
  # replays the RESERVED verify graph and tolerates the GRAPH_BS=8/MEM=0.85 config (the validated stable
  # point for this model+spec). Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name qwen35b-mtp -- docker compose --profile qwen35b-mtp up -d
  qwen35b-mtp:
    <<: *lean-common
    profiles: ["qwen35b-mtp"]
    container_name: ${LEASE_NAME:-minisgl-lean}-qwen35b-mtp
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-pahajokiconsulting/Qwen3.6-35B-A3B-MXFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm mtp --spec-num-draft "${MINISGL_SPEC_K:-2}" \
          --reasoning-parser auto \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-8}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-6}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.85}" \
          ${MINISGL_EXTRA_ARGS:-}

  # PRIMARY spec serve. Qwen3.6-35B-A3B-MXFP4 target + DFlash block-diffusion spec-decode with a
  # SEPARATE trained drafter (z-lab/Qwen3.6-35B-A3B-DFlash). K=15 = the drafter's block size (memory
  # dflash-fullctx-fix). DFlash's accept-len (~4.67) beats MTP's (~2) on this GDN+MoE target, so this
  # is the throughput-preferred spec config when it fits.
  # CONCURRENCY IS UNBLOCKED (2026-07-14): the TP>1 verify desync that GPU-faulted at bs>1 is FIXED —
  # 65915b6 broadcasts rank0's drafts so every TP rank verifies the identical batch, and 98ea775 pads
  # partial-K steps to uniform num_draft so they replay the GDN verify GRAPH instead of the eager path.
  # DFlash-on-MoE at concurrency c~3-4 is the literature's winning spec regime (expert saturation makes
  # the wide verify ~free); MAX_RUNNING defaults to 8 (c<=4 is graph-captured at GRAPH_BS=4, 5-8 eager
  # but now crash-safe). GPU-VALIDATION of the concurrency fix is still pending; the throughput knee and
  # the VRAM ceiling on 2x16GB want a measurement window before pushing MAX_RUNNING/GRAPH_BS higher.
  # MEMORY-RAZOR-THIN at TP=2/16GB: GRAPH_BS=4 MEM=0.80 boots; MEM>=0.82 or GRAPH_BS=8 runtime-OOMs the
  # GDN verify (continuance Gotcha). MINISGL_DFLASH_QUANT=fp8|int8 weight-only-quantizes the replicated
  # drafter to ~half if a bigger pair is needed; MINISGL_DFLASH_DDTREE=1 routes it through the draft-TREE
  # step. Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name qwen35b-dflash -- docker compose --profile qwen35b-dflash up -d
  qwen35b-dflash:
    <<: *lean-common
    profiles: ["qwen35b-dflash"]
    container_name: ${LEASE_NAME:-minisgl-lean}-qwen35b-dflash
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-pahajokiconsulting/Qwen3.6-35B-A3B-MXFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm dflash \
          --spec-draft-model-path "${MINISGL_DFLASH_MODEL:-z-lab/Qwen3.6-35B-A3B-DFlash}" \
          --spec-num-draft "${MINISGL_SPEC_K:-15}" \
          --reasoning-parser auto \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-4}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-8}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.80}" \
          ${MINISGL_EXTRA_ARGS:-}

  # poolside/Laguna-XS-2.1-NVFP4 — SWA-hybrid gated-attention MoE. FIRST end-to-end NVFP4 quant-path
  # serve: NVFP4 folds LOSSLESSLY into the e2m1 W4A8-WMMA kernel (fp16 per-group scale =
  # weight_scale_e4m3 / weight_global_scale at group-16; identical E2M1 codes to MXFP4, no FP4 hw, no
  # upconvert). Routed + shared experts are NVFP4; backbone / gated SWA attention / dense-L0 / untied
  # lm_head stay bf16. Plain TP=2 (NO EP): the loader intermediate-splits every routed expert's FFN
  # across the two ranks (exactly as GLM/qwen at TP=2), so each 16GB card holds ~half the 31B of expert
  # weight (~7.7GB) plus the bf16 backbone. (EP-over-TP does NOT engage from --enable-ep alone without a
  # DP launcher, so it is intentionally omitted — --enable-ep here would starve one card and OOM.) SWA
  # (10 full + 30 sliding, window 512) needs the hip attention backend (window-bounded ring KV pool).
  # Spec OFF for the coherence bring-up; use the laguna-dflash profile for spec.
  #   gpu-lease -n 2 --detach --name laguna -- docker compose --profile laguna up -d
  laguna:
    <<: *lean-common
    profiles: ["laguna"]
    container_name: ${LEASE_NAME:-minisgl-lean}-laguna
    # restart "no" (NOT unless-stopped): under a gpu-lease --detach, a crash+auto-restart orphans the
    # container (lease-watcher releases on the stop, restart brings it back with no lease -> holds the
    # cards for everyone). A leased serve must DIE on crash so the lease frees. Re-up manually.
    restart: "no"
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-poolside/Laguna-XS-2.1-NVFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type naive \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-8}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-8}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.85}" \
          ${MINISGL_EXTRA_ARGS:-}

  # Laguna-XS-2.1-NVFP4 target + its matching DFlash block-diffusion drafter
  # (poolside/Laguna-XS-2.1-DFlash-NVFP4: 5 sliding layers, block_size 16, aux target layers
  # [1,13,25,33,39]). DFlash is uniform-K wider-verify; K defaults to the drafter's block size (16).
  # Same TP=2+EP memory layout as the laguna profile. Measure the spec speedup honestly (prior DFlash
  # recipes were net-negative on some targets).
  #   gpu-lease -n 2 --detach --name laguna-dflash -- docker compose --profile laguna-dflash up -d
  laguna-dflash:
    <<: *lean-common
    profiles: ["laguna-dflash"]
    container_name: ${LEASE_NAME:-minisgl-lean}-laguna-dflash
    restart: "no"  # lease-safe: die on crash so the gpu-lease frees, never orphan-restart
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    environment:
      <<: *lean-env
      # SWA prefix caching (Track A/C): snapshot/restore the sliding-window ring so a reused prefix
      # (e.g. a shared system prompt) skips re-prefill. Requires --cache-type radix (below). Validated
      # to coexist with DFlash spec (Track C). MINISGL_SWA_RADIX=0 to disable.
      MINISGL_SWA_RADIX: "${MINISGL_SWA_RADIX:-1}"
      # page_size=16 under spec (lifts the legacy per-token rollback override). NOT a cold-prefill perf
      # lever (A/B ~neutral), but REQUIRED for SWA-radix to reliably HIT: page-16-aligned snapshot
      # boundaries make prefix reuse fire where page_size=1 silently misses (measured: same 1216-token
      # prefix — ps=16 hits, ps=1 0 hits). GPU-validated coherent + lossless. Forced on for THIS serve
      # only (not the global default — other MHA-spec models aren't validated at ps=16).
      MINISGL_SPEC_MHA_PAGED: "${MINISGL_SPEC_MHA_PAGED:-1}"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-poolside/Laguna-XS-2.1-NVFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type "${MINISGL_CACHE_TYPE:-radix}" \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm dflash \
          --spec-draft-model-path "${MINISGL_DFLASH_MODEL:-poolside/Laguna-XS-2.1-DFlash-NVFP4}" \
          --spec-num-draft "${MINISGL_SPEC_K:-16}" \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-4}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-4}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.90}" \
          ${MINISGL_EXTRA_ARGS:-}

  # poolside/Laguna-XS-2.1-NVFP4 — full production serve bundling this session's validated wins,
  # GRAPH-CAPTURED (never eager):
  #   * group-16 NVFP4 decode GEMV — automatic (MINISGL_NVFP4_GEMV default-on, baked into :lean):
  #     2.24x decode (21.7 -> 48.6 tok/s bs=1) vs the old mis-applied prefill-WMMA kernel.
  #   * SWA prefix caching (--cache-type radix + MINISGL_SWA_RADIX=1): snapshot/restore the sliding-
  #     window ring across the boundary; ~11-25x TTFT on a reused prefix, byte-identical to cold.
  #   * fp8 KV (MINISGL_KV_FP8 default 1) works through the SWA extend path (descale-on-gather).
  #   * CUDA-graph capture ON (SWA decode capture is byte-identical to eager, mirrors GDNGraphCapture).
  # For spec use laguna-dflash (SWA-radix x DFlash coexistence is validated lossless; mind mr<=0.90).
  #   gpu-lease -n 2 --detach --name laguna-radix -- docker compose --profile laguna-radix up -d
  laguna-radix:
    <<: *lean-common
    profiles: ["laguna-radix"]
    container_name: ${LEASE_NAME:-minisgl-lean}-laguna-radix
    restart: "no"  # lease-safe: die on crash so the gpu-lease frees, never orphan-restart
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    environment:
      <<: *lean-env
      # SWA prefix caching on: snapshot/restore the sliding-window ring so a reused prefix skips
      # re-prefill. Needs --cache-type radix (below). Default-off in code; enabled here.
      MINISGL_SWA_RADIX: "${MINISGL_SWA_RADIX:-1}"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-poolside/Laguna-XS-2.1-NVFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-8}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-8}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.85}" \
          ${MINISGL_EXTRA_ARGS:-}

  # ZAYA1-8B base (Zyphra CCA MoE), compressed-tensors W8A8-fp8, DP=2 + expert-parallel. Runs as DP=2
  # replicas (one per gfx1201 card) with --enable-ep sharding the 128 experts across the pair so the
  # ~9 GB fp8 weights fit 16 GB/card. Default checkpoint is /models/ZAYA1-8B-fp8. Needs BOTH cards
  # (DP=2): lease -n 2. The CCA fusions are default-on.
  # WHY fp8 (not the RXF 4-bit quant): the RXF-h32 build regressed constrained decode — its noisier
  # 4-bit logits flip grammar-masked argmaxes to "..." placeholders after a β-force-close (spine
  # specify/classification "..." fills), and its rxf_hip linear_gemv is uncoalesced (~39 vs ~52 tok/s
  # single-stream). fp8's 8-bit logits are clean under the same grammar/RSA path. Serve RXF instead
  # with MINISGL_MODEL=/root/.cache/huggingface/ZAYA1-8B-RXF-h32 MINISGL_EXTRA_ARGS= (RXF has no EP
  # path — its weights replicate). (TiDAR variant in 2c58e2e.)
  #   gpu-lease -n 2 --detach --name minisgl-zaya -- docker compose --profile zaya up -d
  zaya:
    <<: *lean-common
    # No image override: ZAYA uses the SAME lean image as every other serve. Its kernels (zaya_cca /
    # w8a8 / moe_w8a16 / attn_prefill_paged etc.) come from the canonical /kernels/_kernels mount
    # below, so there is no ZAYA-specific baked-kernel image anymore (the old `lean-zaya` tag). The
    # lean image also carries xgrammar, so structured output / json_schema / tools work on this lane.
    profiles: ["zaya"]
    container_name: ${LEASE_NAME:-minisgl-lean}-zaya
    restart: unless-stopped
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_DIR:-/home/pat/models}:/models
      # Re-distilled on-policy DFlash-CCA drafter (captured on THIS dense_gemm serve, num_spec=4).
      # Default = the epoch-4 on-policy checkpoint; point at a later/final checkpoint via the env.
      - ${MINISGL_DFLASH_DRAFT_HOST:-/home/pat/code/_models/ZAYA1-8B-DFlash-CCA-5L-minv-ep4}:/draft:ro
    environment:
      <<: *lean-env
      MINISGL_MOE_SCATTER: "${MINISGL_MOE_SCATTER:-0}"
      # Forced tool calls emit ZAYA's NATIVE <zyphra_tool_call><function=NAME><parameter=P>…</parameter>
      # XML (via a custom EBNF grammar) instead of JSON — respects ZAYA's RL training and is guaranteed
      # parseable. Auto tool calls additionally now trigger on <zyphra_tool_call> (was never firing).
      MINISGL_TOOL_FORMAT: "${MINISGL_TOOL_FORMAT:-zaya_xml}"
      # Spec-decode is OPT-IN and OFF by default: on the served numbers DFlash spec makes ZAYA ~4x
      # SLOWER (43 -> 11 tok/s). ZAYA is compute-cheap (~1.3B active/token, ~23ms/step decode) so the
      # per-step spec cost (drafter forward + K-wide verify + DDTree) dwarfs the accept gain: the -ep4
      # drafter delivers only ~1.11 emitted/step / ddtree accept-len ~0.11 on the DP=2 graph serve.
      # Set MINISGL_ZAYA_SPEC=1 to turn the DFlash+DDTree lane back on (drafter mount + envs below are
      # inert when it's off). Break-even needs emitted/step well above ~2 AND a cheaper per-step path.
      MINISGL_ZAYA_SPEC: "${MINISGL_ZAYA_SPEC:-}"
      # DFlash draft-TREE verify (DDTree): per-position top-K marginals -> best-first tree -> more
      # accepted tokens/step than the linear block. Only consulted when MINISGL_ZAYA_SPEC=1.
      MINISGL_DFLASH_DDTREE: "${MINISGL_DFLASH_DDTREE:-1}"
      MINISGL_DDTREE_BUDGET: "${MINISGL_DDTREE_BUDGET:-32}"
      # On-policy Draft-OPD capture: when set (+ MINISGL_ZAYA_SPEC=1, MINISGL_DFLASH_DDTREE=0), the
      # scheduler dumps the drafter's own trajectory per verify step as opdbuf_*.pt for retraining
      # (dflash-drafter). Write under /engine (the `.:/engine` mount) to reach the host. Inert unset.
      MINISGL_ZAYA_OPD_CAPTURE_DIR: "${MINISGL_ZAYA_OPD_CAPTURE_DIR:-}"
      # Kernels come from the image's baked /opt/kernels (inherited PYTHONPATH from *lean-env,
      # /opt/kernels FIRST) — same as every other profile. No live /kernels override: the canonical
      # kernels are now baked at image-build time, so a rebuild carries every latest build (including
      # the split-K + GQA head-grouping attn_decode) with no stale-symlink hazard.
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        # Spec-decode is opt-in (net-negative on ZAYA — see MINISGL_ZAYA_SPEC note above). Only append
        # the DFlash+DDTree args when explicitly enabled; the default serve is plain DP=2 (~43 tok/s).
        SPEC_ARGS=""
        if [ -n "${MINISGL_ZAYA_SPEC:-}" ]; then
          SPEC_ARGS="--spec-algorithm dflash --spec-draft-model-path /draft --spec-num-draft ${MINISGL_SPEC_K:-4}"
        fi
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-/models/ZAYA1-8B-MXFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --data-parallel-size 2 \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-16}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.9}" \
          --rsa-n "${MINISGL_RSA_N:-4}" \
          --rsa-t "${MINISGL_RSA_T:-1}" \
          --rsa-think-budget "${MINISGL_RSA_THINK_BUDGET:-512}" \
          --rsa-max-tokens "${MINISGL_RSA_MAX_TOKENS:-1024}" \
          --rsa-agg-max-tokens "${MINISGL_RSA_AGG_MAX_TOKENS:-640}" \
          --rsa-tail-tokens "${MINISGL_RSA_TAIL_TOKENS:-2048}" \
          --rsa-top-p "${MINISGL_RSA_TOP_P:-0.95}" \
          $SPEC_ARGS \
          ${MINISGL_EXTRA_ARGS:---enable-ep}

  # CAM editable-memory serve: Qwen3.6-35B-A3B-AWQ + the CAM #100 pointer/retrieve memory plane
  # (namespaces #6, persistence #7, write-gate, freeze/no-clobber, audit/undo). Recall-only on this
  # base: the 4B-trained checkpoint's hidden (2560) != served (2048), so CAM auto-falls-back to
  # pointer/retrieve-only (the residual tap needs a 35B-trained checkpoint). The /cam/* edit plane
  # mounts when MINISGL_CAM=1; transparent read/write ride /v1/*. Validated 5/5 recall + 7/7 hardening
  # surface under graph capture (docs/zaya-port/CAM_35B_TP2_GAP.md). Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name cam -- docker compose --profile cam up -d
  # The 4B pointer checkpoint (MINISGL_CAM_CHECKPOINT_HOST) and the persist dir (MINISGL_CAM_STORE_HOST,
  # survives restart via load-on-boot + debounced autosave) are bind-mounted; override either via env.
  cam:
    <<: *lean-common
    profiles: ["cam"]
    container_name: ${LEASE_NAME:-minisgl-lean}-cam
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      - ${MINISGL_CAM_CHECKPOINT_HOST:-/home/pat/code/memory-organ-softsteer/cam_ckpt}:/cam_ckpt:ro
      - ${MINISGL_CAM_STORE_HOST:-./.cam_store}:/cam_store
      - ${MINISGL_CAM_GTE_HOST:-/home/pat/code/minisgl-rdna4/.cam_gte}:/cam_gte:ro   # whitened-GTE key artifact (opt-in)
    environment:
      <<: *lean-env
      MINISGL_CAM: "1"
      MINISGL_CAM_CHECKPOINT: /cam_ckpt
      # Sampled (rejection) spec-verify ON by default: lets MTP engage for NON-greedy UNCONSTRAINED
      # requests instead of falling back to plain decode. NOTE: does NOT help grammar-constrained
      # requests (the JSON-schema spine turns) — those still fall back until spec+grammar is wired.
      MINISGL_SPEC_SAMPLED: "${MINISGL_SPEC_SAMPLED:-1}"
      MINISGL_CAM_FRONTEND: "1"                                # route /cam/* to the backend engine.cam
      MINISGL_CAM_AUTO: "${MINISGL_CAM_AUTO:-1}"               # transparent read on /v1/*
      MINISGL_CAM_AUTO_WRITE: "${MINISGL_CAM_AUTO_WRITE:-1}"   # gated ambient write on /v1/* (per-req cam_write wins)
      MINISGL_CAM_WRITE_GATE: "${MINISGL_CAM_WRITE_GATE:-1}"   # base-uncertainty gate (opt-in in frontend mode)
      MINISGL_CAM_STORE_PATH: /cam_store/store.pt              # #7 load-on-boot + debounced autosave
      MINISGL_CAM_MAX_FACTS: "${MINISGL_CAM_MAX_FACTS:-0}"     # 0 = no LRU eviction cap (per-namespace)
      MINISGL_CAM_MAX_NAMESPACES: "${MINISGL_CAM_MAX_NAMESPACES:-0}"  # 0 = unlimited; else cap tenant namespaces (DoS)
      MINISGL_CAM_API_TOKEN: "${MINISGL_CAM_API_TOKEN:-}"      # single admin token (any namespace); blank = open
      MINISGL_CAM_TOKENS: "${MINISGL_CAM_TOKENS:-}"            # multi-tenant: JSON {token: "<ns>"|["<ns>",..]|"*"}
      MINISGL_CAM_REQ_KV_FRAC: "${MINISGL_CAM_REQ_KV_FRAC:-0.70}"  # runaway-generation-kv-guard: force-finish a single req at 70% of the KV pool
      MINISGL_CAM_GTE_KEY: "${MINISGL_CAM_GTE_KEY:-0}"          # 1 = whitened-GTE semantic subject key (paraphrase-robust addressing 0.06->0.43)
      MINISGL_CAM_GTE_WHITEN: /cam_gte/gte_whiten.pkl
      MINISGL_CAM_WRITE_DEDUP_TAU: "${MINISGL_CAM_WRITE_DEDUP_TAU:-}"  # write-side paraphrase dedup cosine; blank => 0.82 under GTE (measured safe), 1.0 (off) on base-embed
      MINISGL_MOE_SCATTER: "0"
      MINISGL_MOE_FUSED_SILU: "${MINISGL_MOE_FUSED_SILU:-1}"   # operator toggle; set 0 if boot fails with "fused gemm1+silu needs the 'wmma' kernel"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-8}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-6}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.80}" \
          --spec-algorithm "${MINISGL_CAM_SPEC:-mtp}" --spec-num-draft "${MINISGL_SPEC_K:-4}" \
          ${MINISGL_EXTRA_ARGS:-}
