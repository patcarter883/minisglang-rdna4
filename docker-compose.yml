# MiniSGL-RDNA4 serving stack (shared ROCm image vllm22-w4a8:combined + this repo's HIP kernels).
#
# This repo mounts its source into the shared image (it is NOT baked — see CLAUDE.md "Container-run
# conventions"). The five native HIP kernel packages (gdn_hip, attn_decode, attn_hip,
# attn_prefill_paged, tail_hip) are AOT-compiled, and their .so are gitignored, so a checkout must
# build them once before serving. The `build` profile does exactly that (CPU-only, no GPU/lease).
#
# GPU work is leased through the shared-box arbiter; launch the serve profile THROUGH it so the
# lease injects ROCR/HIP_VISIBLE_DEVICES + LEASE_NAME and binds to the container's lifetime:
#
#   LEASE=/home/pat/code/vllm-gfx1201/scripts/gpu-lease.sh
#
#   # 1) one-time AOT build of the HIP kernels (CPU only — NO lease):
#   docker compose --profile build up --abort-on-container-exit
#
#   # 2) serve (radix prefix-cache on). --detach binds the lease to the container:
#   $LEASE -n 1 --detach -- docker compose --profile serve up -d
#   docker compose --profile serve logs -f          # follow boot
#   $LEASE -n 1 --detach -- docker compose --profile serve down   # stop + release
#
# `serve` depends_on `build` (service_completed_successfully), so `--profile serve up` alone also
# builds first if you skip step 1 — the build runs inside the lease then (harmless, CPU-fast on a
# warm build). Override the model/port/etc via a .env file or the shell (see ${VARS} below).

x-minisgl-common: &minisgl-common
  image: vllm22-w4a8:combined
  restart: "no"
  working_dir: /engine
  volumes:
    # Mount this repo as /engine (source + the HIP packages' built .so live here).
    - .:/engine
    # HuggingFace cache (model snapshots) — offline at run time.
    - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
  environment: &minisgl-env
    # gdn_hip + the four serve-path packages import from the repo root; engine from python/.
    PYTHONPATH: /engine/python:/engine
    GPU_ARCHS: gfx1201

services:
  # --- AOT build of the five native HIP kernel packages (CPU only; NO GPU device / lease) ---
  build:
    <<: *minisgl-common
    # In both profiles so `--profile serve up` can resolve+run it via serve's depends_on, while
    # `--profile build up` runs it standalone (CPU, no lease).
    profiles: ["build"]
    container_name: minisgl-hip-build
    entrypoint: ["bash", "-lc"]
    command:
      - |
        source /app/.venv/bin/activate
        set -e
        for pkg in gdn_hip attn_decode attn_hip attn_prefill_paged tail_hip; do
          echo "=== AOT build: $$pkg ==="
          ( cd /engine/$$pkg && GPU_ARCHS=gfx1201 python setup.py build_ext --inplace )
        done
        echo "=== all HIP kernel packages built ==="

  # --- Serve (radix prefix-cache ON; native-HIP Triton-free path on by default) ---
  serve:
    <<: *minisgl-common
    profiles: ["serve"]
    container_name: ${LEASE_NAME:-minisgl}-serve
    restart: unless-stopped
    # depends_on:
    #   build:
    #     condition: service_completed_successfully
    # ROCm device passthrough is MANDATORY (else is_rocm() -> False and boot crashes).
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add: [video]
    security_opt: [seccomp=unconfined, label=disable]
    cap_add: [SYS_PTRACE]
    ipc: host
    shm_size: "16gb"
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      # Warm Triton cache (the GDN/attention autotune) — shared with vllm-gfx1201's combined image.
      - ${MINISGL_TRITON_CACHE:-/home/pat/code/vllm-gfx1201/.triton-cache-combined}:/root/.triton
    environment:
      <<: *minisgl-env
      HF_HUB_OFFLINE: "1"
      TORCH_BLAS_PREFER_HIPBLASLT: "0"
      # The lease injects the leased card set; these two MUST stay distinct (physical id vs its
      # 0-based re-index) — setting both to the physical id breaks whenever card 1 is leased.
      ROCR_VISIBLE_DEVICES: "${LEASE_ROCR_DEVICES:-0,1}"
      HIP_VISIBLE_DEVICES: "${LEASE_HIP_DEVICES:-0,1}"
      # Native-HIP serve path: on by default; set =0 for a pure-Triton / torch debug A/B.
      MINISGL_ATTN_HIP: "${MINISGL_ATTN_HIP:-1}"
      MINISGL_TAIL_HIP: "${MINISGL_TAIL_HIP:-1}"
      # fp8 (e4m3) KV cache on by default — halves KV bytes; native HIP fp8 paged-decode +
      # fp8 paged/chunked-prefill carry it end-to-end. Set =0 for bf16 KV.
      MINISGL_KV_FP8: "${MINISGL_KV_FP8:-1}"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        source /app/.venv/bin/activate
        pip install -q msgpack pyzmq prompt_toolkit accelerate 2>&1 | tail -1
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-auto}" \
          --page-size 16 \
          --tp 2 \
          --cuda-graph-max-bs 0 \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.8}" \
          ${MINISGL_EXTRA_ARGS:-}
