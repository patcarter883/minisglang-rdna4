# minisgl-rdna4 serving stack — a from-scratch, purpose-built image (Dockerfile), NOT the vllm image.
#
# The image is built for minisglang: ROCm 7.2.1 + torch(gfx1201) + the engine's python deps + the
# custom HIP kernels built from the CANONICAL `rdna4-hip-kernels` repo. No vllm, sglang, flashinfer,
# triton, or sgl_kernel.
#
# The engine SOURCE is hot-mounted at /engine (edit-and-restart), but the kernels come from the image
# (/opt/kernels, canonical) — the repo no longer vendors them.
#
# Usage (GPU work leased through the shared arbiter; --detach binds the lease to the container):
#   # build (CPU only — kernel compiles need no GPU/lease):
#   docker compose build
#   # serve (single card):
#   gpu-lease -n 1 --detach -- docker compose --profile serve up -d
#   docker compose --profile serve logs -f
#   gpu-lease -n 1 --detach -- docker compose --profile serve down

x-lean-common: &lean-common
  image: ${MINISGL_IMAGE:-minisgl-rdna4:lean}
  build:
    context: .
    dockerfile: Dockerfile
    additional_contexts:
      # The canonical kernels live outside this repo's build context — inject them by name.
      kernels: ${RDNA4_HIP_KERNELS:-/home/pat/code/rdna4-hip-kernels}
  restart: "no"
  working_dir: /engine
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add: [video]
  security_opt: [seccomp=unconfined, label=disable]
  cap_add: [SYS_PTRACE]
  ipc: host
  shm_size: "16gb"
  volumes:
    # Engine source (kernels are NOT here anymore — they come from /opt/kernels in the image).
    - .:/engine
    - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
  environment: &lean-env
    # /opt/kernels (canonical HIP kernels, baked into the image) FIRST so nothing under /engine can
    # shadow them; /engine/python = engine; /engine = the 3 not-yet-canonical kernels (w8a8 /
    # moe_bf16 / rxf, still vendored here until ported upstream).
    PYTHONPATH: /opt/kernels:/engine/python:/engine
    HF_HUB_OFFLINE: "1"
    TORCH_BLAS_PREFER_HIPBLASLT: "0"
    # Fragmentation guard: on the 16 GB cards a full-model + graph-capture footprint (e.g. the 35B
    # MXFP4 GDN-hybrid) can leave enough free memory but too little CONTIGUOUS free after capture —
    # a tiny post-capture alloc then OOMs on fragmentation. expandable_segments lets the allocator
    # grow segments instead. Overridable/empty-safe.
    PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
    # The lease injects the leased card set; these MUST stay distinct (physical id vs 0-based
    # re-index) — see CLAUDE.md visible-devices recipe.
    ROCR_VISIBLE_DEVICES: "${LEASE_ROCR_DEVICES:-0}"
    HIP_VISIBLE_DEVICES: "${LEASE_HIP_DEVICES:-0}"
    MINISGL_KV_FP8: "${MINISGL_KV_FP8:-1}"
    # Reasoning + structured output: gate the JSON grammar until </think> (default on). Set 0 to
    # apply the schema from token 0 even with thinking on (the pre-fix behavior / A-B toggle).
    MINISGL_GRAMMAR_THINK_GATE: "${MINISGL_GRAMMAR_THINK_GATE:-1}"
    # DFlash drafter weight-only quant (fp8|int8) — halves the replicated drafter to fit big pairs.
    MINISGL_DFLASH_QUANT: "${MINISGL_DFLASH_QUANT:-}"
    # DDTree: route DFlash through the drafter-agnostic draft-TREE step (per-position top-K marginals
    # -> best-first tree -> ancestor-mask verify) for a higher accept-len than the linear K chain.
    # Forwarded so the scheduler's os.environ read sees it inside the container; topk/budget default
    # in the scheduler when unset.
    MINISGL_DFLASH_DDTREE: "${MINISGL_DFLASH_DDTREE:-}"
    MINISGL_DDTREE_TOPK: "${MINISGL_DDTREE_TOPK:-}"
    MINISGL_DDTREE_BUDGET: "${MINISGL_DDTREE_BUDGET:-}"
    # MTP-head layer count override (config.py knob): forces the Qwen3.5 MTP head on/off through
    # compose. Empty -> trust the checkpoint (default). 0 -> no MTP head (serve the base decoder only).
    MINISGL_MTP_LAYERS: "${MINISGL_MTP_LAYERS:-}"
    # Spec-decode on-device accept+EOS chain (spec/accept_gpu.py): 1 = replace the per-position
    # argmax .cpu() + per-req Python verify/keep loop with the vectorized GPU chain (one batched
    # sync). Byte-lossless; falls back to the host path for constrained/ddtree batches. Default 0.
    MINISGL_SPEC_ONDEVICE: "${MINISGL_SPEC_ONDEVICE:-0}"
    # torch.profiler window (diagnostic): MINISGL_PROFILE=<path under /engine> captures SKIP..SKIP+STEPS
    # forward/verify steps into a chrome trace. Inert unless set. Point at /engine/... so it lands in
    # the mounted worktree; name it *.pt.trace.json.gz so torch gzips it and TraceLens ingests it.
    MINISGL_PROFILE: "${MINISGL_PROFILE:-}"
    MINISGL_PROFILE_SKIP: "${MINISGL_PROFILE_SKIP:-40}"
    MINISGL_PROFILE_STEPS: "${MINISGL_PROFILE_STEPS:-50}"

services:
  # Default: Qwen3.6-35B-A3B-AWQ (W4A8 MoE) on the native-HIP Triton-free path, radix prefix cache.
  serve:
    <<: *lean-common
    profiles: ["serve"]
    container_name: ${LEASE_NAME:-minisgl-lean}-serve
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-auto}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-0}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.8}" \
          ${MINISGL_EXTRA_ARGS:-}

  # Qwen3.6-35B-A3B-AWQ (W4A16 compressed-tensors MoE, GDN-hybrid) at TP=2 with MTP spec-decode UNDER
  # CUDA graph capture. Graph capture is REQUIRED — spec run eager is not the served config and its
  # numbers are not a result (graph-capture-required rule); that is why cuda-graph-max-bs defaults to
  # 16 here, not 0. The MTP head is itself MoE. Draft length MINISGL_SPEC_K defaults to the sweep-
  # optimal K=4 (graph-captured sweep: baseline 47.7 -> 64.7 tok/s at K=4, +36%; falls off past 5).
  # Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name qwen -- docker compose --profile qwen up -d
  qwen:
    <<: *lean-common
    profiles: ["qwen"]
    container_name: ${LEASE_NAME:-minisgl-lean}-qwen
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-auto}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm mtp --spec-num-draft "${MINISGL_SPEC_K:-4}" \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-16}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-32}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.82}" \
          ${MINISGL_EXTRA_ARGS:-}

  # GLM-4.7-Flash-AWQ (W4A8 AWQ MoE + MLA) at TP=2 with MTP spec-decode UNDER CUDA graph capture
  # (num_nextn_predict_layers=1). Same graph-capture requirement as `qwen`. Draft length
  # MINISGL_SPEC_K defaults to the sweep-optimal K=1 (graph-captured sweep: baseline 37.6 -> 52.4
  # tok/s at K=1, +39%; GLM's MTP head only lands ~1 token so K>=2 is a NET LOSS). Needs TP=2.
  #   gpu-lease -n 2 --detach --name glm -- docker compose --profile glm up -d
  glm:
    <<: *lean-common
    profiles: ["glm"]
    container_name: ${LEASE_NAME:-minisgl-lean}-glm
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-QuantTrio/GLM-4.7-Flash-AWQ}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-auto}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm mtp --spec-num-draft "${MINISGL_SPEC_K:-1}" \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-16}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-32}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.82}" \
          ${MINISGL_EXTRA_ARGS:-}

  # Qwen3.6-35B-A3B-MXFP4 (GDN-hybrid + 128-expert MoE; MXFP4 weights, bf16-native, MTP head left
  # UNQUANTIZED) at TP=2 with MTP spec-decode UNDER CUDA graph capture. This is the prod spec config —
  # MTP K=4 gives the best real-text tok/s on this GDN+MoE target (memory spec-decode-breakeven-gdn-moe;
  # DFlash K=15 is a wider-verify tax — use the qwen35b-dflash profile for that). MTP is uniform-K so it
  # replays the RESERVED verify graph and tolerates the GRAPH_BS=8/MEM=0.85 config (the validated stable
  # point for this model+spec). Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name qwen35b-mtp -- docker compose --profile qwen35b-mtp up -d
  qwen35b-mtp:
    <<: *lean-common
    profiles: ["qwen35b-mtp"]
    container_name: ${LEASE_NAME:-minisgl-lean}-qwen35b-mtp
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-pahajokiconsulting/Qwen3.6-35B-A3B-MXFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm mtp --spec-num-draft "${MINISGL_SPEC_K:-4}" \
          --reasoning-parser auto \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-8}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-6}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.85}" \
          ${MINISGL_EXTRA_ARGS:-}

  # Same Qwen3.6-35B-A3B-MXFP4 target, but DFlash block-diffusion spec-decode with a SEPARATE trained
  # drafter (z-lab/Qwen3.6-35B-A3B-DFlash). K=15 = the drafter's block size (memory dflash-fullctx-fix).
  # MEMORY-RAZOR-THIN at TP=2/16GB: GRAPH_BS=4 MEM=0.80 boots; MEM>=0.82 or GRAPH_BS=8 runtime-OOMs the
  # GDN verify (continuance Gotcha). MINISGL_DFLASH_QUANT=fp8|int8 weight-only-quantizes the replicated
  # drafter to ~half if a bigger pair is needed; MINISGL_DFLASH_DDTREE=1 routes it through the draft-TREE
  # step. Needs BOTH cards (TP=2): lease -n 2.
  #   gpu-lease -n 2 --detach --name qwen35b-dflash -- docker compose --profile qwen35b-dflash up -d
  qwen35b-dflash:
    <<: *lean-common
    profiles: ["qwen35b-dflash"]
    container_name: ${LEASE_NAME:-minisgl-lean}-qwen35b-dflash
    restart: unless-stopped
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-pahajokiconsulting/Qwen3.6-35B-A3B-MXFP4}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --tp "${MINISGL_TP:-2}" \
          --disable-pynccl \
          --spec-algorithm dflash \
          --spec-draft-model-path "${MINISGL_DFLASH_MODEL:-z-lab/Qwen3.6-35B-A3B-DFlash}" \
          --spec-num-draft "${MINISGL_SPEC_K:-15}" \
          --reasoning-parser auto \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-4}" \
          --max-running-requests "${MINISGL_MAX_RUNNING:-8}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.80}" \
          ${MINISGL_EXTRA_ARGS:-}

  # ZAYA1-8B base (Zyphra CCA MoE), compressed-tensors W8A8-fp8 — NO TiDAR spec-decode. Runs as
  # DP=2 replicas (one per gfx1201 card) with expert-parallel (EP shards experts across the pair),
  # so it needs BOTH cards: lease -n 2. This is the validated base-zaya serve restored from git
  # history (was migrated to the TiDAR variant in 2c58e2e; TiDAR block recoverable from there).
  # Serves the standard checkpoint at /models/ZAYA1-8B-fp8; override with MINISGL_MODEL. EP is on by
  # default via the EXTRA_ARGS fallback (set MINISGL_EXTRA_ARGS to override).
  #   gpu-lease -n 2 --detach --name minisgl-zaya -- docker compose --profile zaya up -d
  zaya:
    <<: *lean-common
    image: minisgl-rdna4:lean-zaya           # superset image (ZAYA CCA + MoE kernels)
    profiles: ["zaya"]
    container_name: ${LEASE_NAME:-minisgl-lean}-zaya
    restart: unless-stopped
    volumes:
      - .:/engine
      - ${HF_HOME:-/home/pat/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_DIR:-/home/pat/models}:/models
    environment:
      <<: *lean-env
      MINISGL_MOE_SCATTER: "${MINISGL_MOE_SCATTER:-0}"
    ports:
      - "${MINISGL_HOST_PORT:-1919}:1919"
    entrypoint: ["bash", "-lc"]
    command:
      - |
        exec python -m minisgl \
          --model "${MINISGL_MODEL:-/models/ZAYA1-8B-fp8}" \
          --host 0.0.0.0 --port 1919 \
          --cache-type radix \
          --attention-backend "${MINISGL_ATTN_BACKEND:-hip}" \
          --page-size 16 \
          --data-parallel-size 2 \
          --disable-pynccl \
          --cuda-graph-max-bs "${MINISGL_CUDA_GRAPH_MAX_BS:-16}" \
          --memory-ratio "${MINISGL_MEM_RATIO:-0.9}" \
          ${MINISGL_EXTRA_ARGS:---enable-ep}
